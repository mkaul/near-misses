.foot{font-family:var(--ui);font-size:.84rem;color:var(--muted);max-width:80ch;display:grid;gap:6px}

.wrap a{color:var(--accent);text-underline-offset:2px;text-decoration-thickness:1px}
.term{border-bottom:1px dotted var(--muted);cursor:help}
.term:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#tip{position:absolute;z-index:20;max-width:min(320px,calc(100vw - 32px));background:var(--fg);color:var(--bg);font-family:var(--ui);font-size:.85rem;line-height:1.45;padding:8px 11px;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.18)}

.wrap>header{padding-right:96px}

  en:{label:"Transmigrating soul",name:"Transmigrating soul and karma as retribution",bezug:"Rebirth, kamma",beh:"A soul wanders through lives and evolves upwards; whatever happens is the deserved result of past deeds.",verf:"Rebirth without a wandering self. Kamma is intention, not cosmic bookkeeping; not every feeling comes from past kamma.",feind:"Responsibility for one’s own actions.",kanon:"MN 38, AN 3.61, SN 36.21 (Sīvaka)",bsp:"Theosophy (Blavatsky, Olcott); “You brought this on yourself in a past life”",own:{erk:"Rebirth needs no wandering self, and kamma is intention (AN 6.63), not retribution. Not every feeling comes from past deeds (SN 36.21).",bew:"From looking back at past lives to the intention in this moment: what am I intending now?"}}},
 {id:"selbst",k:"A",x:-.35,y:-.42,
  de:{label:"Buddha-Natur als Selbst",name:"Buddha-Natur als wahres Selbst",bezug:"Tathāgatagarbha, Zen",beh:"In jedem wohnt ein unveränderliches wahres Selbst, die Buddha-Natur.",verf:"Schon das Laṅkāvatāra-Sūtra nennt die Lehre vom Keim ein geschicktes Mittel für die, die vor anattā erschrecken. Wörtlich genommen wird sie attā.",feind:"Vertrauen, dass Erwachen möglich ist.",kanon:"MN 22; Laṅkāvatāra-Sūtra; Debatte um „Critical Buddhism“ (Hakamaya, Matsumoto)",bsp:"Populäre Rede vom „wahren Selbst“"},
  en:{label:"Buddha-nature as self",name:"Buddha-nature as true self",bezug:"Tathāgatagarbha, Zen",beh:"In everyone dwells an unchanging true self, the Buddha-nature.",verf:"The Laṅkāvatāra Sūtra itself calls the teaching of the embryo a skilful means for those frightened by anattā. Taken literally, it becomes attā.",feind:"Confidence that awakening is possible.",kanon:"MN 22; Laṅkāvatāra Sūtra; the “Critical Buddhism” debate (Hakamaya, Matsumoto)",bsp:"Popular talk of the “true self”"}},
 {id:"manifest",k:"A",x:-.85,y:-.5,
  de:{label:"Bewusstsein erschafft Welt",name:"Bewusstsein erschafft die Wirklichkeit",bezug:"Yogācāra „nur Geist“; Dhp 1",beh:"Der Geist erschafft die Welt; wer sein Bewusstsein ändert, ändert die Wirklichkeit nach Wunsch.",verf:"Dhp 1 meint die Ethik der Absicht, nicht Weltschöpfung. Yogācāra analysiert Erfahrung und erklärt am Ende auch den Geist für leer.",feind:"Einsicht in die gestaltende Rolle des Geistes.",kanon:"Dhp 1–2, AN 3.61 (Schöpfungsglaube)",bsp:"Manifestations- und „Law of Attraction“-Literatur mit Nondual-Vokabular",own:{erk:"„Der Geist geht den Dingen voran“ (Dhp 1) heißt: Absicht prägt Erfahrung und Folgen. Es heißt nicht, dass Wünsche die Welt erschaffen.",bew:"Die Wunschbewegung selbst ansehen: Manifestieren-Wollen ist taṇhā mit spirituellem Vokabular."}},
  en:{label:"Mind creates the world",name:"Consciousness creates reality",bezug:"Yogācāra “mind only”; Dhp 1",beh:"The mind creates the world; change your consciousness and you change reality at will.",verf:"Dhp 1 is about the ethics of intention, not world-creation. Yogācāra analyses experience and in the end declares the mind empty too.",feind:"Insight into the shaping role of the mind.",kanon:"Dhp 1–2, AN 3.61 (creator view)",bsp:"Manifestation and “Law of Attraction” literature with nondual vocabulary",own:{erk:"“Mind precedes things” (Dhp 1) means that intention shapes experience and consequences. It does not mean that wishes create the world.",bew:"Look at the wishing itself: wanting to manifest is taṇhā in spiritual vocabulary."}}},
 {id:"jetzt",k:"D",x:-.42,y:-.62,
  de:{label:"Präsenz-Kult",name:"Das Jetzt als Heimat",bezug:"sati, Zen, Präsenzlehren",beh:"Im Jetzt zu sein ist das Ziel; Präsenz ist, was man ist.",verf:"Das Gegenwärtige ist der Ort der Einsicht in Vergänglichkeit, nicht der Ort, an dem man sich niederlässt. Heideggers Einwand der „beständigen Anwesenheit“ trifft hier.",feind:"Sammlung im Gegenwärtigen.",kanon:"MN 131 (Bhaddekaratta), MN 1",bsp:"Bestimmte Rezeptionen populärer Präsenzliteratur",own:{erk:"Auch das Jetzt entsteht und vergeht. Es ist der Ort der Einsicht, nicht ein Ort zum Bleiben (MN 131).",bew:"Das Gegenwärtige untersuchen, statt sich darin einzurichten: Was entsteht hier gerade, was vergeht?"}},
  en:{label:"Cult of presence",name:"The Now as home",bezug:"sati, Zen, presence teachings",beh:"Being in the Now is the goal; presence is what you are.",verf:"The present is where impermanence is seen, not a place to settle down. Heidegger’s objection of “constant presence” applies here.",feind:"Collectedness in the present.",kanon:"MN 131 (Bhaddekaratta), MN 1",bsp:"Certain receptions of popular presence literature",own:{erk:"The Now, too, arises and passes. It is the place of insight, not a place to stay (MN 131).",bew:"Investigate the present instead of settling into it: what is arising here right now, what is passing?"}}},
 {id:"inflation",k:"E",x:-.65,y:-.8,
  de:{label:"Ich bin das Ganze",name:"Inflation: „Ich bin das Absolute“",bezug:"Advaita (aham brahmāsmi)",beh:"Ich bin Gott, das Ganze, das Bewusstsein selbst.",verf:"Das Ich, das den Satz ausspricht, ist genau der ahaṃkāra. Ramana: Der Satz ist kein Gedanke zum Wiederholen. Im Kanon: der Dünkel „ich bin“ (asmimāna).",feind:"Erkenntnis der Nicht-Getrenntheit.",kanon:"SN 22.89 (Khemaka), MN 1 (das All ersinnen)",bsp:"Jungs Begriff der Inflation; Lehrer mit Absolutheitsanspruch"},
  en:{label:"I am the whole",name:"Inflation: “I am the Absolute”",bezug:"Advaita (aham brahmāsmi)",beh:"I am God, the whole, consciousness itself.",verf:"The I that utters the sentence is precisely the ahaṃkāra. Ramana: the sentence is not a thought to repeat. In the Canon: the conceit “I am” (asmimāna).",feind:"Recognition of non-separation.",kanon:"SN 22.89 (Khemaka), MN 1 (conceiving the All)",bsp:"Jung’s concept of inflation; teachers claiming absolute authority"}},
 {id:"hongaku",k:"C",x:-.22,y:-.7,
  de:{label:"Schon erleuchtet",name:"„Schon erleuchtet, also keine Übung“",bezug:"Zen (hongaku), „Jeder ist schon erleuchtet“",beh:"Da alle ursprünglich erleuchtet sind, ist Übung überflüssig.",verf:"Dōgens Ausgangszweifel: Wenn ursprünglich erleuchtet, warum üben alle Buddhas? Seine Antwort: Übung ist Vollzug der Erleuchtung. Der Satz zeigt, er ersetzt nicht.",feind:"Nichts muss hinzugefügt werden.",kanon:"Dōgen (shushō ittō); MN 22",bsp:"Der Buchtitel von Christian Meyer ist eine legitime Zeigegeste in dieser Linie und kippt erst, wenn er die Übung ersetzt."},
  en:{label:"Already enlightened",name:"“Already enlightened, so no practice”",bezug:"Zen (hongaku), “Everyone is already enlightened”",beh:"Since everyone is originally enlightened, practice is superfluous.",verf:"Dōgen’s starting doubt: if we are originally enlightened, why do all Buddhas practise? His answer: practice is the enactment of enlightenment. The sentence points; it does not replace.",feind:"Nothing needs to be added.",kanon:"Dōgen (shushō ittō); MN 22",bsp:"Christian Meyer’s book title (“Jeder ist schon erleuchtet”) is a legitimate pointer in this line and only tips over when it replaces practice."}},
 {id:"antinom",k:"C",x:.05,y:-.92,
  de:{label:"Jenseits von Gut und Böse",name:"Antinomismus",bezug:"Tantra, Zen, Advaita („der Weise handelt nicht“)",beh:"Wer erwacht ist, steht über Regeln; Ethik gilt nur für Unerwachte.",verf:"sīla ist Grundlage und Frucht. Der Arahant kann gar nicht mehr absichtlich töten, stehlen oder lügen.",feind:"Freiheit von Regelzwang.",kanon:"AN 9.7 (Sutavā), MMK 24.10",bsp:"Rechtfertigungen von Lehrermissbrauch als „verrückte Weisheit“"},
  en:{label:"Beyond good and evil",name:"Antinomianism",bezug:"Tantra, Zen, Advaita (“the sage does not act”)",beh:"The awakened stand above rules; ethics is only for the unawakened.",verf:"sīla is foundation and fruit. An arahant can no longer intentionally kill, steal or lie.",feind:"Freedom from rule-bound compulsion.",kanon:"AN 9.7 (Sutavā), MMK 24.10",bsp:"Justifications of teacher abuse as “crazy wisdom”"}},
 {id:"niemand",k:"C",x:.55,y:-.78,
  de:{label:"Niemand da",name:"„Niemand da, nichts zu tun“",bezug:"Advaita ohne Vedānta",beh:"Es gibt keinen, der übt, keinen Weg, nichts zu tun; alles ist schon, was es ist.",verf:"Klassisches Advaita verlangt Voraussetzungen (sādhana-catuṣṭaya) und Hören, Nachdenken, Vertiefen. Die letzte Aussage wird gegen die konventionelle Ebene gewendet.",feind:"Tun braucht kein Täter-Ich.",kanon:"BĀU 2.4.5 (śrotavyo mantavyo nididhyāsitavyaḥ); MN 22",bsp:"Radikales Neo-Advaita (z. B. Tony Parsons)"},
  en:{label:"Nobody home",name:"“Nobody here, nothing to do”",bezug:"Advaita without Vedānta",beh:"There is no one who practises, no path, nothing to do; everything already is what it is.",verf:"Classical Advaita requires prerequisites (sādhana-catuṣṭaya) and hearing, reflecting, meditating. The ultimate statement is turned against the conventional level.",feind:"Action needs no doer-self.",kanon:"BĀU 2.4.5 (śrotavyo mantavyo nididhyāsitavyaḥ); MN 22",bsp:"Radical Neo-Advaita (e.g. Tony Parsons)"}},
 {id:"bypass",k:"F",x:.15,y:-.5,
  de:{label:"Spirituelles Umgehen",name:"Spirituelles Umgehen",bezug:"Nicht-Identifikation, Leerheit",beh:"Gefühle, Verletzungen und Konflikte sind nur Gedanken oder Erscheinungen und brauchen keine Aufmerksamkeit.",verf:"Der erste Pfeil wird gefühlt, nur der zweite entfällt. Was nicht gefühlt wurde, ist nicht durchschaut, sondern verdrängt.",feind:"Nicht-Identifikation mit Emotionen.",kanon:"SN 36.6 (Sallatha)",bsp:"John Welwood (1984) prägte den Begriff; „it's all just a thought“ als Abkürzung"},
  en:{label:"Spiritual bypassing",name:"Spiritual bypassing",bezug:"Non-identification, emptiness",beh:"Feelings, wounds and conflicts are just thoughts or appearances and need no attention.",verf:"The first arrow is felt; only the second falls away. What was never felt has not been seen through but repressed.",feind:"Non-identification with emotions.",kanon:"SN 36.6 (Sallatha)",bsp:"John Welwood (1984) coined the term; “it’s all just a thought” as a shortcut"}},
 {id:"mcmind",k:"G",x:.25,y:-.38,
  de:{label:"Achtsamkeit als Wellness",name:"Achtsamkeit als Wellness",bezug:"sati, Vipassanā",beh:"Achtsamkeit ist eine Technik zur Stressreduktion und Leistungssteigerung.",verf:"sati ohne rechte Ansicht, ohne sīla und ohne Ziel. „Stress“ ersetzt dukkha; das Ende des Begehrens wird zur besseren Funktionsfähigkeit.",feind:"Achtsamkeit selbst.",kanon:"MN 117 (rechte Ansicht geht voran), SN 45.8",bsp:"Ron Purser, „McMindfulness“ (2019)"},
  en:{label:"Mindfulness as wellness",name:"Mindfulness as wellness",bezug:"sati, Vipassanā",beh:"Mindfulness is a technique for reducing stress and boosting performance.",verf:"sati without right view, without sīla and without a goal. “Stress” replaces dukkha; the end of craving becomes better functioning.",feind:"Mindfulness itself.",kanon:"MN 117 (right view comes first), SN 45.8",bsp:"Ron Purser, “McMindfulness” (2019)"}},
 {id:"nihil",k:"B",x:.9,y:-.15,
  de:{label:"Leerheit als Nichts",name:"Leerheit als Nichts",bezug:"Madhyamaka, śūnyatā",beh:"Nichts existiert wirklich, also ist nichts von Bedeutung.",verf:"Leerheit ist bedingtes Entstehen, nicht Nicht-Sein. Nāgārjuna warnt: Falsch ergriffen zerstört sie wie eine falsch gepackte Schlange.",feind:"Leerheitseinsicht.",kanon:"MMK 24.11 und 24.18; SN 12.15",bsp:"Nihilistische Lesarten von „alles ist Illusion“"},
  en:{label:"Emptiness as nothing",name:"Emptiness as nothingness",bezug:"Madhyamaka, śūnyatā",beh:"Nothing really exists, so nothing matters.",verf:"Emptiness is dependent origination, not non-existence. Nāgārjuna warns: grasped wrongly, it destroys like a snake seized the wrong way.",feind:"Insight into emptiness.",kanon:"MMK 24.11 and 24.18; SN 12.15",bsp:"Nihilistic readings of “everything is illusion”"}},
 {id:"nihilismus",k:"B",x:.92,y:-.55,
  de:{label:"Nihilismus",name:"Nihilismus: „Nichts hat Wert“",bezug:"dukkha, anattā, nirodha; Advaita „jagan mithyā“",beh:"Leben ist Leiden, das Selbst ist Illusion, das Ziel ist Erlöschen. Also hat nichts Wert, und Handeln ist gleichgültig.",verf:"Liest Befreiung als Auslöschung und Erkenntnis als Entwertung. dukkha ist eine Diagnose mit Heilmittel, kein Urteil über den Wert des Lebens. nibbāna ist das Erlöschen von Gier, Hass und Verblendung, nicht von Wesen. Advaitas mithyā heißt „weder wirklich noch unwirklich“, nicht „nichts“. Und wer sagt „nichts hat Wert“, behauptet wieder etwas über das, was ist: „es ist nicht“.",feind:"Ernüchterung (nibbidā) und Loslassen (virāga).",kanon:"DN 2 (Ajita Kesakambalī), MN 117 und MN 60 (natthika-diṭṭhi als falsche Ansicht), SN 22.85 (Yamaka), SN 12.15",bsp:"Nietzsches Bild vom Buddhismus als „passivem Nihilismus“ über Schopenhauer; „alles ist Illusion, also egal“"},
  en:{label:"Nihilism",name:"Nihilism: “Nothing has value”",bezug:"dukkha, anattā, nirodha; Advaita “jagan mithyā”",beh:"Life is suffering, the self is an illusion, the goal is extinction. So nothing has value, and action doesn’t matter.",verf:"Reads liberation as annihilation and insight as devaluation. dukkha is a diagnosis with a cure, not a verdict on life’s worth. nibbāna is the extinguishing of greed, hatred and delusion, not of beings. Advaita’s mithyā means “neither real nor unreal”, not “nothing”. And whoever says “nothing has value” is again asserting something about what is: “it is not”.",feind:"Disenchantment (nibbidā) and letting go (virāga).",kanon:"DN 2 (Ajita Kesakambalī), MN 117 and MN 60 (natthika-diṭṭhi as wrong view), SN 22.85 (Yamaka), SN 12.15",bsp:"Nietzsche’s picture of Buddhism as “passive nihilism”, via Schopenhauer; “it’s all illusion, so who cares”"}},
 {id:"reduktiv",k:"B",x:.82,y:.0,
  de:{label:"Tot ist tot",name:"Reduktiver Säkularbuddhismus",bezug:"anattā, Neurowissenschaft",beh:"Kein Selbst heißt: Es gibt nur das Gehirn, und mit dem Tod ist alles aus.",verf:"Der Buddha weist auch die Vernichtungsansicht zurück. anattā ist Nicht-Aneignung, keine materialistische These. Zum Tathāgata nach dem Tod schweigt er.",feind:"Nüchternheit gegenüber Metaphysik.",kanon:"SN 44.10, SN 44.1",bsp:"Reduktive Lesarten in säkularen Strömungen, nicht Batchelors agnostische Position selbst",own:{erk:"Der Buddha weist auch „mit dem Tod ist alles aus“ zurück. Sein Schweigen über den Tathāgata nach dem Tod ist keine verschämte Verneinung (SN 44.1).",bew:"Vom Bescheidwissen zum Offenhalten: die Frage unbeantwortet lassen, ohne sie zu verneinen."}},
  en:{label:"Dead is dead",name:"Reductive secular Buddhism",bezug:"anattā, neuroscience",beh:"No self means there is only the brain, and death ends everything.",verf:"The Buddha also rejects the annihilationist view. anattā is non-appropriation, not a materialist thesis. On the Tathāgata after death he stays silent.",feind:"Sobriety about metaphysics.",kanon:"SN 44.10, SN 44.1",bsp:"Reductive readings in secular currents, not Batchelor’s agnostic position itself",own:{erk:"The Buddha also rejects “death ends everything”. His silence about the Tathāgata after death is not a bashful denial (SN 44.1).",bew:"From knowing better to keeping open: leave the question unanswered without denying it."}}},
 {id:"depers",k:"F",x:.65,y:.4,
  de:{label:"Fühlen abgeschaltet",name:"Abgeschaltetes Fühlen als Erwachen",bezug:"upekkhā, anattā",beh:"Wer nichts mehr fühlt und keinen Bezug mehr zum Selbst hat, ist frei.",verf:"Depersonalisation ist keine Befreiung. Der Arahant fühlt; Gleichgültigkeit ist der nahe Feind des Gleichmuts. Die brahmavihāra fehlen.",feind:"upekkhā.",kanon:"SN 36.6, Vism IX",bsp:"Lindahl und Britton zu schwierigen Meditationserfahrungen",own:{erk:"Abgeschaltetes Fühlen ist ein Symptom, kein Ergebnis von Einsicht, und kann behandlungsbedürftig sein (Lindahl und Britton).",bew:"Nicht weiter vertiefen, sondern erden: Körper, Bewegung, Kontakt zu Menschen, mettā. Hält es an, fachliche Begleitung suchen."}},
  en:{label:"Feeling switched off",name:"Switched-off feeling as awakening",bezug:"upekkhā, anattā",beh:"Whoever no longer feels anything and has no relation to a self is free.",verf:"Depersonalisation is not liberation. The arahant feels; indifference is the near enemy of equanimity. The brahmavihāra are missing.",feind:"upekkhā.",kanon:"SN 36.6, Vism IX",bsp:"Lindahl and Britton on challenging meditation experiences",own:{erk:"Switched-off feeling is a symptom, not a result of insight, and may need treatment (Lindahl and Britton).",bew:"Don’t go deeper; ground yourself instead: body, movement, contact with people, mettā. If it persists, seek professional support."}}},
 {id:"zenwar",k:"C",x:.4,y:.52,
  de:{label:"Niemand stirbt",name:"„Kein Selbst, also tötet niemand“",bezug:"anattā; Bhagavad Gītā 2.19",beh:"Da es kein Selbst gibt, stirbt niemand; Töten im Dienst ist selbstlos.",verf:"anattā wird zur Lizenz. Die Gītā-Stelle („er tötet nicht, wird nicht getötet“) wird aus ihrem Rahmen gelöst. Die erste Übungsregel gilt ohne Ausnahme.",feind:"Handeln ohne Ich-Bezug.",kanon:"Dhp 129–130; erste Übungsregel",bsp:"Brian Victoria, „Zen at War“",own:{erk:"Ohne Selbst bleibt der Schmerz der anderen: Alle zittern vor dem Stock, alle fürchten den Tod (Dhp 129).",bew:"Sich selbst zum Vergleich nehmen (attānaṃ upamaṃ katvā) und die Lehre auf das eigene Handeln richten, nicht auf das Opfer."}},
  en:{label:"Nobody dies",name:"“No self, so nobody kills”",bezug:"anattā; Bhagavad Gītā 2.19",beh:"Since there is no self, nobody dies; killing in service is selfless.",verf:"anattā becomes a licence. The Gītā verse (“he does not kill, nor is he killed”) is torn from its frame. The first precept holds without exception.",feind:"Acting without self-reference.",kanon:"Dhp 129–130; first precept",bsp:"Brian Victoria, “Zen at War”",own:{erk:"Without a self, the pain of others remains: all tremble at the rod, all fear death (Dhp 129).",bew:"Take yourself as the measure (attānaṃ upamaṃ katvā) and apply the teaching to your own actions, not to the victim."}}},
 {id:"egotot",k:"B",x:.5,y:.88,
  de:{label:"Das Ego töten",name:"„Das Ego töten“",bezug:"anattā, Entsagung",beh:"Das Ego ist der Feind und muss mit Gewalt bezwungen werden.",verf:"Der Wunsch, nicht zu sein (vibhava-taṇhā), ist selbst Begehren. Selbstquälerei ist das zweite Extrem; der Bodhisatta erinnert sich unter dem Rosenapfelbaum an die Freude der Versenkung und gibt die Askese auf.",feind:"Entsagung (nekkhamma).",kanon:"SN 56.11, MN 36",bsp:"Harte „Ego-Death“-Rhetorik",own:{erk:"Der Wunsch, nicht zu sein (vibhava-taṇhā), ist selbst Begehren. Wer das Ich bekämpft, bestätigt es als Gegner.",bew:"Den Kampf beenden und dem, was auftaucht, freundlich begegnen. Der Bodhisatta findet den Weg, als er sich an die mühelose Freude der ersten Vertiefung erinnert (MN 36)."}},
  en:{label:"Killing the ego",name:"“Killing the ego”",bezug:"anattā, renunciation",beh:"The ego is the enemy and must be subdued by force.",verf:"The wish not to be (vibhava-taṇhā) is itself craving. Self-mortification is the second extreme; under the rose-apple tree the Bodhisatta recalls the joy of absorption and gives up asceticism.",feind:"Renunciation (nekkhamma).",kanon:"SN 56.11, MN 36",bsp:"Hard “ego death” rhetoric",own:{erk:"The wish not to be (vibhava-taṇhā) is itself craving. Fighting the self confirms it as an opponent.",bew:"End the fight and meet whatever arises with kindness. The Bodhisatta finds the way when he remembers the effortless joy of the first absorption (MN 36)."}}},
 {id:"stufen",k:"D",x:.1,y:.78,
  de:{label:"Stufenjagd",name:"Erleuchtung als Leistungssport",bezug:"ñāṇa-Karten, Pfadstufen",beh:"Fortschritt heißt, die nächste Stufe zu erreichen und zu bestätigen.",verf:"Die Stufen sind wie Staffelwagen: Jeder bringt zum nächsten, keiner ist das Ziel. Karten beschreiben, sie sind keine Trophäen.",feind:"Präzision und Ernsthaftigkeit.",kanon:"MN 24 (Rathavinīta)",bsp:"Teile der Szene um pragmatisches Dharma; die Karten selbst sind nützlich"},
  en:{label:"Stage hunting",name:"Awakening as competitive sport",bezug:"ñāṇa maps, stages of the path",beh:"Progress means reaching and confirming the next stage.",verf:"The stages are like relay chariots: each brings you to the next, none is the goal. Maps describe; they are not trophies.",feind:"Precision and earnestness.",kanon:"MN 24 (Rathavinīta)",bsp:"Parts of the pragmatic dharma scene; the maps themselves are useful"}},
 {id:"spirmat",k:"E",x:-.2,y:.62,
  de:{label:"Spiritueller Materialismus",name:"Spiritueller Materialismus",bezug:"Praxis, Erfahrungen, Lehrer",beh:"Einsichten, Zustände und Einweihungen sammeln sich wie Besitz an.",verf:"Der gute Mensch erhebt sich nicht über andere wegen seiner Versenkungen. Wer Erwachen besitzt, hat ein neues Selbst.",feind:"Ernsthafte Hingabe an die Praxis.",kanon:"MN 113 (Sappurisa), SN 22.89",bsp:"Chögyam Trungpa, „Cutting Through Spiritual Materialism“ (1973)"},
  en:{label:"Spiritual materialism",name:"Spiritual materialism",bezug:"Practice, experiences, teachers",beh:"Insights, states and initiations pile up like possessions.",verf:"A good person does not exalt themselves over others because of their absorptions. Whoever owns awakening has a new self.",feind:"Earnest dedication to practice.",kanon:"MN 113 (Sappurisa), SN 22.89",bsp:"Chögyam Trungpa, “Cutting Through Spiritual Materialism” (1973)"}},
 {id:"jhana",k:"D",x:-.62,y:.38,
  de:{label:"Versenkung als Ziel",name:"Versenkung als Ziel",bezug:"samādhi, nirvikalpa",beh:"Der tiefste Versenkungszustand ist die Befreiung.",verf:"Der Bodhisatta verlässt Āḷāra Kālāma und Uddaka Rāmaputta, weil Nichtsheit und Weder-Wahrnehmung-noch-Nichtwahrnehmung nicht zum Erlöschen führen. Bei Ramana entspricht das kevala- statt sahaja-samādhi.",feind:"Rechte Sammlung.",kanon:"MN 26 (Ariyapariyesana)",bsp:"Jagd nach Zuständen; Gleichsetzung von Absorption und Erwachen",own:{erk:"Auch die tiefste Versenkung ist gestaltet, gewollt und darum vergänglich (MN 52).",bew:"Nach der Versenkung die Versenkung selbst betrachten und ihre Bedingtheit sehen, statt sie nur zu wiederholen."}},
  en:{label:"Absorption as goal",name:"Absorption as the goal",bezug:"samādhi, nirvikalpa",beh:"The deepest absorption is liberation.",verf:"The Bodhisatta leaves Āḷāra Kālāma and Uddaka Rāmaputta because nothingness and neither-perception-nor-non-perception do not lead to extinction. In Ramana’s terms: kevala instead of sahaja-samādhi.",feind:"Right concentration.",kanon:"MN 26 (Ariyapariyesana)",bsp:"Chasing states; equating absorption with awakening",own:{erk:"Even the deepest absorption is constructed, willed and therefore impermanent (MN 52).",bew:"After absorption, look at the absorption itself and see its conditionality instead of merely repeating it."}}},
 {id:"zeuge",k:"E",x:-.28,y:.3,
  de:{label:"Zeuge als Standort",name:"Der Zeuge als neuer Standort",bezug:"sākṣin, Vipassanā-Beobachter",beh:"Ich bin der unbeteiligte Beobachter hinter allem.",verf:"Der Zeuge ist in Advaita ein Durchgangsbegriff, im Vipassanā ist Beobachten höhere Auflösung, kein Abstand. Die Verortung wird verschoben, nicht aufgelöst.",feind:"Nicht-Identifikation.",kanon:"MN 1; Ud 1.10 (Bāhiya: „nicht hier, nicht dort“)",bsp:"„Ich bin nur der Beobachter“ als Dauerhaltung; Dissoziation unter spirituellem Namen"},
  en:{label:"Witness as standpoint",name:"The witness as a new standpoint",bezug:"sākṣin, the Vipassanā observer",beh:"I am the uninvolved observer behind everything.",verf:"In Advaita the witness is a transitional concept; in Vipassanā, observing means finer resolution, not distance. The location is shifted, not dissolved.",feind:"Non-identification.",kanon:"MN 1; Ud 1.10 (Bāhiya: “neither here nor there”)",bsp:"“I’m just the observer” as a permanent stance; dissociation under a spiritual name"}}
];

/* ---------- rendering ---------- */
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("map");
const P=(x,y)=>[500+x*400,500+y*400];
let active=null, selected="glas";
const $=id=>document.getElementById(id);
function el(t,a,txt){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);if(txt!=null)n.textContent=txt;return n}
function drawMap(){
  const S=STR[lang].axis;
  svg.innerHTML="";svg.setAttribute("aria-label",STR[lang].mapLabel);
  svg.appendChild(el("rect",{x:0,y:0,width:1000,height:1000,fill:"var(--surface)"}));
  [200,400].forEach(r=>svg.appendChild(el("circle",{cx:500,cy:500,r,class:"ring","stroke-dasharray":"2 6"})));
  svg.appendChild(el("line",{x1:40,y1:500,x2:960,y2:500,class:"axis"}));
  svg.appendChild(el("line",{x1:500,y1:50,x2:500,y2:950,class:"axis"}));
  svg.appendChild(el("text",{x:22,y:530,class:"axislbl"},S.l));
  svg.appendChild(el("text",{x:22,y:548,class:"axissub"},S.ls));
  svg.appendChild(el("text",{x:978,y:530,class:"axislbl","text-anchor":"end"},S.r));
  svg.appendChild(el("text",{x:978,y:548,class:"axissub","text-anchor":"end"},S.rs));
  svg.appendChild(el("text",{x:500,y:30,class:"axislbl","text-anchor":"middle"},S.t));
  svg.appendChild(el("text",{x:500,y:990,class:"axislbl","text-anchor":"middle"},S.b));
  svg.appendChild(el("circle",{cx:500,cy:500,r:150,class:"ring","stroke-dasharray":"5 5"}));
  TRAD.forEach(([n,a])=>{const r=150,ra=a*Math.PI/180;svg.appendChild(el("text",{x:500+r*Math.cos(ra),y:504+r*Math.sin(ra),class:"trad","text-anchor":"middle"},n))});
  svg.appendChild(el("circle",{cx:500,cy:500,r:62,fill:"var(--accent)","fill-opacity":".12",stroke:"var(--accent)","stroke-width":"1.5"}));
  svg.appendChild(el("text",{x:500,y:494,"text-anchor":"middle",style:"font-family:var(--display);font-size:19px;font-weight:700;fill:var(--accent)"},S.c));
  svg.appendChild(el("text",{x:500,y:522,"text-anchor":"middle",style:"font-size:13px;fill:var(--accent);paint-order:stroke;stroke:var(--surface);stroke-width:4px"},"majjhimā paṭipadā"));
  E.forEach(e=>{
    const [cx,cy]=P(e.x,e.y);const left=cx>760;
    const g=el("g",{class:"node",tabindex:0,role:"button","data-id":e.id,"aria-label":T(e).name});
    g.appendChild(el("circle",{cx,cy,r:8,fill:`var(--c${e.k})`,stroke:"var(--surface)","stroke-width":2}));
    g.appendChild(el("text",{x:left?cx-14:cx+14,y:cy+5,"text-anchor":left?"end":"start"},T(e).label));
    g.addEventListener("click",()=>select(e.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select(e.id)}});
    svg.appendChild(g);
  });
  svgTitles();refresh();
}
function refresh(){
  svg.querySelectorAll(".node").forEach(g=>{const e=E.find(x=>x.id===g.dataset.id);g.classList.toggle("dim",!!active&&e.k!==active);g.classList.toggle("sel",e.id===selected)});
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.k===(active??"")?"true":"false"));
}
function dl(e){const t=T(e),D=STR[lang].dt;return `<dl class="dl">
  <div><dt>${D.bezug}</dt><dd>${t.bezug}</dd></div>
  <div><dt>${D.beh}</dt><dd>${t.beh}</dd></div>
  <div><dt>${D.verf}</dt><dd>${t.verf}</dd></div>
  <div><dt>${D.feind}</dt><dd>${t.feind}</dd></div>
  <div><dt>${D.kanon}</dt><dd>${t.kanon}</dd></div>
  <div><dt>${D.bsp}</dt><dd>${t.bsp}</dd></div></dl>`}
function vert(e){const v=STR[lang].vert;return e.y<-.35?v[0]:e.y>.35?v[1]:v[2]}
function mv(k,e){const c=C(k),S=STR[lang],D=S.dt,o=(e&&T(e).own)||{},tag=x=>e?" · "+(x?S.own:S.cls):"";
  let h=`<dl class="dl" style="border-top:1px solid var(--line);padding-top:10px"><div><dt>${D.erk}${tag(o.erk)}</dt><dd>${o.erk||c.erk}</dd></div><div><dt>${D.bew}${tag(o.bew)}</dt><dd>${o.bew||c.bew}</dd></div>`;
  if(e)h+=`<div><dt>${D.vert}</dt><dd>${vert(e)}</dd></div>`;return h+"</dl>"}
function select(id){
  selected=id;const e=E.find(x=>x.id===id);const c=C(e.k),S=STR[lang];
  const p=$("panel");
  p.innerHTML=`<div class="cls" style="color:var(--c${e.k})">${S.cls} ${e.k} · ${c.name}</div><h3>${T(e).name}</h3>${dl(e)}<p class="hint">${S.q}: <i>${c.q}</i></p>${mv(e.k,e)}`;
  enrich(p);refresh();
}
function renderStatic(){
  const S=STR[lang];
  document.documentElement.lang=lang;document.title=S.title;
  $("s-eyebrow").textContent=S.eyebrow;$("s-h1").textContent=S.h1;
  $("s-intro1").innerHTML=S.intro1;$("s-intro2").innerHTML=S.intro2;
  $("h-basis").textContent=S.hBasis;
  $("s-sources").innerHTML=S.sources.map(([b,s])=>`<div class="src"><b>${b}</b><span>${s}</span></div>`).join("");
  $("s-basishint").innerHTML=S.basisHint;
  $("h-karte").textContent=S.hKarte;$("filters").setAttribute("aria-label",S.filterLabel);
  $("s-maphint").innerHTML=S.mapHint;
  $("h-klassen").textContent=S.hKlassen;$("s-kl1").innerHTML=S.kl1;$("s-kl2").innerHTML=S.kl2;
  $("h-katalog").textContent=S.hKatalog;$("h-spannung").textContent=S.hSpannung;
  $("s-t1").innerHTML=S.t1;$("s-t2").innerHTML=S.t2;$("s-foot1").innerHTML=S.foot1;$("s-foot2").innerHTML=S.foot2;
}
function renderLists(){
  const S=STR[lang];
  const f=$("filters");f.innerHTML="";
  const all=document.createElement("button");all.className="chip";all.dataset.k="";all.textContent=S.all;all.onclick=()=>{active=null;refresh()};f.appendChild(all);
  Object.keys(CLASSES).forEach(k=>{const b=document.createElement("button");b.className="chip";b.dataset.k=k;b.innerHTML=`<i style="background:var(--c${k})"></i>${k} · ${C(k).name}`;b.onclick=()=>{active=active===k?null:k;refresh()};f.appendChild(b)});
  const cl=$("classes");cl.innerHTML="";
  Object.keys(CLASSES).forEach(k=>{const c=C(k);const d=document.createElement("div");d.className="klass";d.style.setProperty("--c",`var(--c${k})`);d.innerHTML=`<div class="tag">${k} · ${c.sub}</div><h3>${c.name}</h3><p class="q">${c.q}</p><p>${c.mech}</p>${mv(k)}<p class="meta">${S.canon}: ${ckanon(k)} · ${E.filter(e=>e.k===k).length} ${S.entries}</p>`;cl.appendChild(d)});
  const cat=$("catalog");cat.innerHTML="";
  Object.keys(CLASSES).forEach(k=>{
    const g=document.createElement("div");g.className="group";
    g.innerHTML=`<h3><i style="background:var(--c${k})"></i>${k} · ${C(k).name}</h3><div class="items">${E.filter(e=>e.k===k).map(e=>`<article class="item"><h4>${T(e).name}</h4>${dl(e)}${mv(k,e)}<button type="button" data-id="${e.id}">${S.show}</button></article>`).join("")}</div>`;
    cat.appendChild(g);
  });
}
function render(){
  tip.hidden=true;
  renderStatic();renderLists();drawMap();
  enrich(document.querySelector(".wrap"));
  select(selected);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
}
function setLang(l){if(l===lang)return;lang=l;try{localStorage.setItem("lang",l)}catch(_){}render()}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
$("catalog").addEventListener("click",ev=>{const b=ev.target.closest("button[data-id]");if(!b)return;active=null;select(b.dataset.id);$("h-karte").scrollIntoView({behavior:"smooth"})});
try{const s=localStorage.getItem("lang");if(s==="en"||s==="de")lang=s}catch(_){}
document.body.appendChild(tip);
render();
</script>

</body></html>
