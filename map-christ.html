de:{
 title:"Unterscheidung der Geister",

 h1:"Unterscheidung der Geister",
 intro1:"Auch das Christentum kennt das „Knapp daneben“. Es nennt die Kunst, das Echte vom täuschend Ähnlichen zu trennen, Unterscheidung der Geister. Ihr Grundsatz steht bei Paulus: Der Feind tritt als Engel des Lichts auf (2 Kor 11,14). Diese Karte ordnet 20 solche Fehlformen, von den Gemeinden des Paulus über das Thomas-Evangelium und Meister Eckhart bis heute.",
 intro2:"Die Karte ist von der christlichen Mitte aus gezeichnet. Was hier am Rand liegt, kann auf den beiden anderen Karten näher an der Mitte stehen, und umgekehrt.",

 m1:"Paulus schreibt: „Nicht mehr ich lebe, sondern Christus lebt in mir“ (Gal 2,20). Der Satz hält zwei Dinge zusammen. Das Ich steht nicht mehr im Mittelpunkt, und doch bleibt jemand, der lebt und liebt. Die Mitte ist hier keine Haltung, die man einnimmt, sondern ein Gegenüber, dem man Raum gibt.",
 m2:"Daraus ergeben sich die beiden Achsen. Waagrecht geht es um das Verhältnis zu Gott. Links wird vermischt: Das Ich setzt sich an Gottes Stelle oder macht Gott zum Besitz. Rechts wird getrennt: Gott rückt in die Ferne, Welt und Leib werden entwertet. Senkrecht geht es um den Weg. Oben steht Gnade ohne Mitwirken, unten Mitwirken ohne Gnade.",

en:{
 title:"Discernment of Spirits",
 eyebrow:"The Christian map of near misses",
 h1:"Discernment of Spirits",
 intro1:"Christianity knows the near miss too. It calls the art of telling the real thing from its deceptive likeness the discernment of spirits. Its principle is in Paul: the enemy appears as an angel of light (2 Cor 11:14). This map orders 20 such near misses, from Paul’s congregations through the Gospel of Thomas and Meister Eckhart to the present.",

  en:{label:"God in my grip",say:"“I know what God is like and what he wants.”",wahr:"Faith needs images and words.",kippt:"The image is mistaken for God. Whoever seeks God in a particular way takes the way (Eckhart). Thomas Aquinas: we know rather what God is not.",stellen:"Exod 20:4 (prohibition of images); Dionysius the Areopagite, Mystical Theology; Augustine, Sermon 117; Eckhart, Sermon 5b",bsp:"Fundamentalism. “God wills it.” One’s own group’s image of God taken for God."}},
 {id:"lieferant",k:"D",x:-.8,y:.5,links:[wp("Wohlstandsevangelium","Prosperity theology"),W.eckhart],
  de:{label:"Gott als Lieferant",say:"„Wer richtig glaubt und betet, wird gesund und reich.“",wahr:"Bitten ist erlaubt: „Bittet und es wird euch gegeben“ (Mt 7,7).",kippt:"Gott wird zum Mittel für meine Zwecke. Eckhart: Manche lieben Gott, wie sie eine Kuh lieben, wegen der Milch und des Käses (Predigt 16b). Und wer krank oder arm bleibt, hat dann angeblich zu wenig geglaubt.",stellen:"Joh 9,2–3 („Weder er noch seine Eltern haben gesündigt“); das Buch Ijob gegen seine Freunde; Mt 4,1–11",bsp:"Wohlstandsevangelium. „Name it and claim it.“ Krankheit als Zeichen mangelnden Glaubens."},
  en:{label:"God as supplier",say:"“Whoever believes and prays rightly will be healthy and rich.”",wahr:"Asking is allowed: “Ask, and it will be given to you” (Matt 7:7).",kippt:"God becomes a means to my ends. Eckhart: some people love God the way they love a cow, for the milk and the cheese (Sermon 16b). And whoever stays ill or poor has then supposedly believed too little.",stellen:"John 9:2–3 (“Neither this man nor his parents sinned”); the Book of Job against his friends; Matt 4:1–11",bsp:"The prosperity gospel. “Name it and claim it.” Illness as a sign of too little faith."}},
 {id:"huetten",k:"D",x:-.5,y:.38,links:[W.jdc,W.teresa,wp("Messalianer","Euchites")],
  de:{label:"Hütten bauen",say:"„Es ist gut, dass wir hier sind. Wir wollen drei Hütten bauen.“",wahr:"Trost und Gipfelerfahrungen sind Geschenke.",kippt:"Petrus will den Augenblick auf dem Berg festhalten (Mk 9,5). Wer die Süße sucht statt Gott, betreibt „geistliche Völlerei“ (Johannes vom Kreuz). Visionen und Tröstungen soll man nicht festhalten.",stellen:"Mk 9,5; Joh 20,17; Johannes vom Kreuz, Dunkle Nacht I,6; Teresa von Ávila, Innere Burg IV,3",bsp:"Hochgefühl im Gottesdienst als Maß des Glaubens. Von Exerzitien zu Exerzitien. Die Messalianer (4. Jh.), die nur spürbare Erfahrung gelten ließen."},
  en:{label:"Building shelters",say:"“It is good for us to be here. Let us set up three tents.”",wahr:"Consolation and peak experiences are gifts.",kippt:"Peter wants to hold on to the moment on the mountain (Mark 9:5). Whoever seeks the sweetness instead of God practises “spiritual gluttony” (John of the Cross). Visions and consolations are not to be held on to.",stellen:"Mark 9:5; John 20:17; John of the Cross, Dark Night I.6; Teresa of Ávila, Interior Castle IV.3",bsp:"The high in worship as the measure of faith. From retreat to retreat. The Messalians (4th c.), who accepted only felt experience."}},
 {id:"eingebung",k:"E",x:-.5,y:.26,links:[wp("Unterscheidung der Geister","Discernment of spirits"),W.ignat,wp("Montanismus","Montanism")],
  de:{label:"Gott hat mir gesagt",say:"„Der Geist hat es mir direkt eingegeben. Darum muss ich niemanden fragen.“",wahr:"Es gibt Eingebung. „Löscht den Geist nicht aus!“ (1 Thess 5,19).",kippt:"Der Satz geht weiter: „Prüft alles und behaltet das Gute“ (1 Thess 5,21). Ungeprüfte Eingebung ist von Wunsch und Eitelkeit nicht zu unterscheiden.",stellen:"1 Joh 4,1; 2 Kor 11,14; 1 Thess 5,19–21; Ignatius, Exerzitien 328–336",bsp:"Montanismus (2. Jh.). Luthers „Schwärmer“. Selbsternannte Propheten.",own:{bew:"Die Eingebung jemandem vorlegen und ihren Verlauf prüfen: Anfang, Mitte und Ende (Ignatius)."}},
  en:{label:"God told me",say:"“The Spirit gave it to me directly. So I don’t need to ask anyone.”",wahr:"Inspiration exists. “Do not quench the Spirit” (1 Thess 5:19).",kippt:"The sentence continues: “Test everything; hold fast to what is good” (1 Thess 5:21). Untested inspiration cannot be told apart from wish and vanity.",stellen:"1 John 4:1; 2 Cor 11:14; 1 Thess 5:19–21; Ignatius, Spiritual Exercises 328–336",bsp:"Montanism (2nd c.). Luther’s “enthusiasts”. Self-appointed prophets.",own:{bew:"Put the inspiration before someone else and examine its course: beginning, middle and end (Ignatius)."}}},
 {id:"pharisaeer",k:"E",x:-.3,y:.62,links:[W.evag,wpEn("Prelest"),W.jdc],
  de:{label:"Der Pharisäer",say:"„Gott, ich danke dir, dass ich nicht wie die anderen Menschen bin.“",wahr:"Ernsthafte Frömmigkeit und Disziplin sind gut.",kippt:"Die Frömmigkeit wird zum Besitz und zum Maß für andere. Evagrius nennt Ruhmsucht und Hochmut die letzten und feinsten Versuchungen. Sie kommen gerade nach dem Fortschritt.",stellen:"Lk 18,9–14; Mt 6,1–6; 1 Kor 8,1; Johannes vom Kreuz, Dunkle Nacht I,2",bsp:"Geistlicher Stolz. In der Ostkirche: Prelest. Frömmigkeit als Status in der Gemeinde."},
  en:{label:"The Pharisee",say:"“God, I thank you that I am not like other people.”",wahr:"Earnest piety and discipline are good.",kippt:"Piety becomes a possession and a yardstick for others. Evagrius calls vainglory and pride the last and subtlest temptations. They come precisely after progress.",stellen:"Luke 18:9–14; Matt 6:1–6; 1 Cor 8:1; John of the Cross, Dark Night I.2",bsp:"Spiritual pride. In the Eastern church: prelest. Piety as status in the congregation."}},
 {id:"allewege",k:"G",x:-.68,y:-.12,links:[wp("Nostra aetate","Nostra aetate"),wp("Synkretismus","Religious syncretism")],
  de:{label:"Alle Wege sind gleich",say:"„Christus, Buddha, Krishna: verschiedene Namen für dasselbe.“",wahr:"Die Kirche lehnt nichts ab, was in anderen Religionen „wahr und heilig“ ist (Nostra aetate 2, 1965). Paulus knüpft in Athen an den „unbekannten Gott“ an (Apg 17,23).",kippt:"Die Unterschiede werden eingeebnet: Person oder Nicht-Selbst, Gnade oder Einsicht, Du oder Das. Wer alles gleichsetzt, hört keinem mehr zu.",stellen:"Apg 17,22–28; Joh 14,6; Nostra aetate 2",bsp:"„Christus-Bewusstsein“ im New Age. Synkretismus. Aus christlicher Sicht steht auch ein Vergleich wie auf diesen drei Karten unter dieser Frage.",own:{bew:"Erst unterscheiden, dann vergleichen. Das Eigene kennen, bevor man es gleichsetzt."}},
  en:{label:"All paths are the same",say:"“Christ, Buddha, Krishna: different names for the same thing.”",wahr:"The church rejects nothing that is “true and holy” in other religions (Nostra aetate 2, 1965). In Athens Paul starts from the “unknown god” (Acts 17:23).",kippt:"The differences are levelled: person or not-self, grace or insight, Thou or That. Whoever equates everything no longer listens to anyone.",stellen:"Acts 17:22–28; John 14:6; Nostra aetate 2",bsp:"“Christ consciousness” in the New Age. Religious syncretism. From a Christian point of view, a comparison like the one across these three maps stands under this question too.",own:{bew:"Distinguish first, then compare. Know your own before equating it."}}},
 {id:"schon",k:"C",x:-.25,y:-.72,links:[W.thomas,wp("Präsentische Eschatologie","Realized eschatology")],
  de:{label:"Schon auferstanden",say:"„Wir sind schon vollendet. Die Auferstehung ist schon geschehen.“",wahr:"Das Reich Gottes ist „mitten unter euch“ (Lk 17,21). Im Thomas-Evangelium: Es ist über die Erde ausgebreitet, und die Menschen sehen es nicht (Logion 113).",kippt:"Das „Schon“ verschluckt das „Noch nicht“. Paulus spottet: „Ihr seid schon satt, ihr seid schon reich geworden“ (1 Kor 4,8).",stellen:"1 Kor 4,8; 2 Tim 2,18; Phil 3,12; Logion 51",bsp:"Die Gemeinde in Korinth. Lesarten des Thomas-Evangeliums ohne Weg, obwohl Logion 2 einen kennt: suchen, finden, erschüttert werden, staunen."},
  en:{label:"Already risen",say:"“We are already perfected. The resurrection has already taken place.”",wahr:"The kingdom of God is “among you” (Luke 17:21). In the Gospel of Thomas: it is spread out upon the earth, and people do not see it (saying 113).",kippt:"The “already” swallows the “not yet”. Paul mocks: “Already you have all you want! Already you have become rich!” (1 Cor 4:8).",stellen:"1 Cor 4:8; 2 Tim 2:18; Phil 3:12; saying 51",bsp:"The congregation in Corinth. Readings of the Gospel of Thomas without a path, although saying 2 knows one: seek, find, be troubled, marvel."}},
 {id:"freibrief",k:"C",x:.0,y:-.9,links:[wp("Antinomismus","Antinomianism"),W.bonh],
  de:{label:"Gnade als Freibrief",say:"„Wo die Gnade ist, gilt kein Gebot mehr.“",wahr:"„Zur Freiheit hat uns Christus befreit“ (Gal 5,1). Augustinus: „Liebe, und tu, was du willst.“",kippt:"Die Freiheit wird vom Lieben getrennt. „Sollen wir an der Sünde festhalten, damit die Gnade umso mächtiger werde? Keineswegs!“ (Röm 6,1). Alles ist erlaubt, aber nicht alles nützt (1 Kor 10,23).",stellen:"Röm 6,1; Gal 5,13; 1 Kor 10,23; Jak 2,17; Bonhoeffer, Nachfolge (1937)",bsp:"Antinomismus zu Luthers Zeit. Bonhoeffers „billige Gnade“. Übergriffe geistlicher Autoritäten mit frommer Begründung."},
  en:{label:"Grace as a licence",say:"“Where grace is, no commandment applies any more.”",wahr:"“For freedom Christ has set us free” (Gal 5:1). Augustine: “Love, and do what you will.”",kippt:"Freedom is cut off from loving. “Should we continue in sin in order that grace may increase? By no means!” (Rom 6:1). All things are permitted, but not all things are beneficial (1 Cor 10:23).",stellen:"Rom 6:1; Gal 5:13; 1 Cor 10:23; Jas 2:17; Bonhoeffer, The Cost of Discipleship (1937)",bsp:"The antinomianism of Luther’s time. Bonhoeffer’s “cheap grace”. Abuse by spiritual authorities with pious justification."}},
 {id:"ruhen",k:"G",x:.3,y:-.78,links:[wp("Quietismus","Quietism (Christian contemplation)"),wp("Miguel de Molinos","Miguel de Molinos"),W.ruus],
  de:{label:"Nur noch ruhen",say:"„Die Seele soll nichts mehr wollen und nichts mehr tun, nicht einmal beten.“",wahr:"Gelassenheit heißt: Gott wirken lassen. „Lasst ab und erkennt, dass ich Gott bin“ (Ps 46,11).",kippt:"Aus Gelassenheit wird Untätigkeit. Ruusbroec nennt das falsche Ledigkeit. Eckhart stellt die tätige Marta über Maria, weil sie aus dem Grund heraus handelt (Predigt 86).",stellen:"Phil 2,12–13; Lk 10,38–42; Ruusbroec, Geistliche Hochzeit II; Verurteilung des Molinos 1687",bsp:"Quietismus (Molinos, Madame Guyon). Heute: „Gott macht das schon“ als Ausrede.",own:{bew:"Die andere Hälfte dazunehmen und mitwirken. Marta nicht gegen Maria ausspielen."}},
  en:{label:"Only resting",say:"“The soul should want nothing and do nothing any more, not even pray.”",wahr:"Releasement means letting God act. “Be still, and know that I am God” (Ps 46:10).",kippt:"Releasement turns into inactivity. Ruusbroec calls this false emptiness. Eckhart ranks the active Martha above Mary because she acts out of the ground (Sermon 86).",stellen:"Phil 2:12–13; Luke 10:38–42; Ruusbroec, Spiritual Espousals II; condemnation of Molinos 1687",bsp:"Quietism (Molinos, Madame Guyon). Today: “God will take care of it” as an excuse.",own:{bew:"Add the other half and cooperate. Don’t play Martha off against Mary."}}},
 {id:"kreuz",k:"F",x:.15,y:-.5,links:[wp("Theologia crucis","Theology of the Cross"),wp("Heidelberger Disputation","Heidelberg Disputation")],
  de:{label:"Am Kreuz vorbei",say:"„Wer wirklich glaubt, ist immer froh.“",wahr:"Freude ist eine echte Frucht des Geistes (Gal 5,22).",kippt:"Leid, Zweifel und Klage werden übersprungen. Luther nennt das Theologie der Herrlichkeit: Sie nennt das Schlechte gut. Die Psalmen klagen, und Jesus weint (Joh 11,35).",stellen:"Luther, Heidelberger Disputation 1518 (These 21); Röm 12,15; Joh 11,35; Mk 15,34",bsp:"Trauernden sagen, es sei Gottes Plan. Dauerlobpreis. Fromme Positivität."},
  en:{label:"Past the cross",say:"“Whoever truly believes is always joyful.”",wahr:"Joy is a real fruit of the Spirit (Gal 5:22).",kippt:"Suffering, doubt and lament are skipped. Luther calls this the theology of glory: it calls evil good. The Psalms lament, and Jesus weeps (John 11:35).",stellen:"Luther, Heidelberg Disputation 1518 (thesis 21); Rom 12:15; John 11:35; Mark 15:34",bsp:"Telling the bereaved that it is God’s plan. Non-stop praise. Pious positivity."}},
 {id:"wohlfuehl",k:"G",x:.3,y:-.35,links:[wpEn("Moralistic therapeutic deism"),W.bonh],
  de:{label:"Wohlfühl-Glaube",say:"„Gott möchte, dass ich nett bin und mich gut fühle. Mehr verlangt er nicht.“",wahr:"Gott ist gütig, und Glaube tröstet.",kippt:"Herausgepickt sind Trost und Moral. Weggelassen sind Umkehr, Kreuz und Nachfolge (Mk 8,34). Häresie heißt wörtlich Auswahl.",stellen:"Mk 8,34; Mt 7,21; Bonhoeffer, Nachfolge (1937)",bsp:"Moralistic Therapeutic Deism. Jesus nur als weiser Lehrer. Christentum als Wertelieferant."},
  en:{label:"Feel-good faith",say:"“God wants me to be nice and to feel good. He asks nothing more.”",wahr:"God is kind, and faith consoles.",kippt:"Consolation and morality have been picked out. Left out are repentance, cross and discipleship (Mark 8:34). The word heresy literally means choice.",stellen:"Mark 8:34; Matt 7:21; Bonhoeffer, The Cost of Discipleship (1937)",bsp:"Moralistic Therapeutic Deism. Jesus only as a wise teacher. Christianity as a supplier of values."}},
 {id:"gnosis",k:"B",x:.85,y:-.25,links:[wp("Gnosis","Gnosticism"),wp("Doketismus","Docetism"),wp("Irenäus von Lyon","Irenaeus"),W.thomas],
  de:{label:"Die Welt ist nichts",say:"„Welt und Leib sind Schein oder Gefängnis. Erlöst wird, wer das erkennt.“",wahr:"Erkenntnis befreit: „Die Wahrheit wird euch befreien“ (Joh 8,32).",kippt:"Die Schöpfung wird zum Unfall. Dagegen steht: „Es war sehr gut“ (Gen 1,31) und „Das Wort ist Fleisch geworden“ (Joh 1,14). Das ist auch das Kriterium der Unterscheidung in 1 Joh 4,2.",stellen:"Gen 1,31; Joh 1,14; 1 Joh 4,2; Irenäus, Gegen die Häresien (um 180)",bsp:"Gnosis, Doketismus, Manichäismus. Einzelne Sprüche im Thomas-Evangelium (Logion 56). Heute: Leibfeindlichkeit, „nur die Seele zählt“."},
  en:{label:"The world is nothing",say:"“World and body are illusion or prison. Whoever sees this is saved.”",wahr:"Knowledge sets free: “The truth will make you free” (John 8:32).",kippt:"Creation becomes an accident. Against this stands: “It was very good” (Gen 1:31) and “The Word became flesh” (John 1:14). That is also the criterion of discernment in 1 John 4:2.",stellen:"Gen 1:31; John 1:14; 1 John 4:2; Irenaeus, Against Heresies (c. 180)",bsp:"Gnosticism, Docetism, Manichaeism. Individual sayings in the Gospel of Thomas (saying 56). Today: hostility to the body, “only the soul counts”."}},
 {id:"akedia",k:"B",x:.9,y:-.02,links:[wp("Acedia","Acedia"),W.evag,W.jdc],
  de:{label:"Der Mittagsdämon",say:"„Es bringt alles nichts. Wozu beten, wozu bleiben?“",wahr:"Trockenheit gehört zum Weg. Johannes vom Kreuz nennt sie die dunkle Nacht.",kippt:"Akedia ist Überdruss, der sich abwendet. Die Nacht ist Trockenheit, die trotzdem sucht. Johannes vom Kreuz gibt drei Zeichen, um beides zu unterscheiden (Dunkle Nacht I,9).",stellen:"Evagrius, Praktikos 12; Ps 91,6; Johannes vom Kreuz, Dunkle Nacht I,9",bsp:"Überdruss im Kloster wie im Alltag. Zynismus gegenüber allem Geistlichen.",own:{bew:"Bleiben und das Kleine tun: Evagrius rät, in der Zelle auszuharren. Hält die Schwere an, kann es eine Depression sein, und die gehört in ärztliche Hände."}},
  en:{label:"The noonday demon",say:"“None of it is any use. Why pray, why stay?”",wahr:"Dryness belongs to the way. John of the Cross calls it the dark night.",kippt:"Acedia is weariness that turns away. The night is dryness that goes on seeking. John of the Cross gives three signs for telling them apart (Dark Night I.9).",stellen:"Evagrius, Praktikos 12; Ps 91:6; John of the Cross, Dark Night I.9",bsp:"Weariness in the monastery as in everyday life. Cynicism towards everything spiritual.",own:{bew:"Stay and do the small thing: Evagrius advises persevering in the cell. If the heaviness persists, it may be depression, and that belongs in a doctor’s hands."}}},
 {id:"fern",k:"F",x:.78,y:.45,links:[wp("Skrupulosität","Scrupulosity"),wp("Jansenismus","Jansenism")],
  de:{label:"Gott ist weit weg",say:"„Gott ist der ferne Richter. Ich muss mich erst würdig machen.“",wahr:"Ehrfurcht: Gott ist größer als alles, was ich denke.",kippt:"Aus Ehrfurcht wird Angst und Abstand. „Furcht gibt es in der Liebe nicht“ (1 Joh 4,18). Der Vater läuft dem verlorenen Sohn entgegen (Lk 15,20).",stellen:"1 Joh 4,18; Lk 15,20; Röm 8,15",bsp:"Skrupulosität. Jansenismus. Strafende Gottesbilder aus der Kindheit.",own:{bew:"Sich finden lassen. Der Vater läuft entgegen, bevor der Sohn sein Bekenntnis zu Ende gesprochen hat."}},
  en:{label:"God is far away",say:"“God is the distant judge. I must first make myself worthy.”",wahr:"Reverence: God is greater than anything I can think.",kippt:"Reverence turns into fear and distance. “There is no fear in love” (1 John 4:18). The father runs to meet the lost son (Luke 15:20).",stellen:"1 John 4:18; Luke 15:20; Rom 8:15",bsp:"Scrupulosity. Jansenism. Punishing images of God from childhood.",own:{bew:"Let yourself be found. The father runs to meet the son before he has finished his confession."}}},
 {id:"kraft",k:"G",x:.3,y:.82,links:[wp("Pelagianismus","Pelagianism"),wp("Augustinus von Hippo","Augustine of Hippo")],
  de:{label:"Aus eigener Kraft",say:"„Wenn ich mich nur genug anstrenge, schaffe ich es.“",wahr:"Mitwirken ist verlangt: „Wirkt mit Furcht und Zittern euer Heil!“ (Phil 2,12).",kippt:"Der zweite Halbsatz fehlt: „Denn Gott ist es, der in euch das Wollen und das Vollbringen bewirkt“ (Phil 2,13).",stellen:"Phil 2,12–13; 1 Kor 4,7; Eph 2,8–9; Synode von Karthago 418",bsp:"Pelagianismus. Heute: Leistungsfrömmigkeit, geistliche Selbstoptimierung.",own:{bew:"Empfangen lernen. „Was hast du, das du nicht empfangen hättest?“ (1 Kor 4,7)."}},
  en:{label:"By my own strength",say:"“If I only try hard enough, I will make it.”",wahr:"Cooperation is required: “Work on your own salvation with fear and trembling” (Phil 2:12).",kippt:"The second half is missing: “For it is God who is at work in you, enabling you both to will and to work” (Phil 2:13).",stellen:"Phil 2:12–13; 1 Cor 4:7; Eph 2:8–9; Council of Carthage 418",bsp:"Pelagianism. Today: performance piety, spiritual self-optimisation.",own:{bew:"Learn to receive. “What do you have that you did not receive?” (1 Cor 4:7)."}}},
 {id:"buchstabe",k:"D",x:.55,y:.62,links:[wp("Gesetzlichkeit (Theologie)","Legalism (theology)")],
  de:{label:"Der Buchstabe",say:"„Wer alle Regeln hält, ist gerecht.“",wahr:"Gebote schützen und geben dem Leben Form.",kippt:"Die Regel wird zum Ziel. „Der Buchstabe tötet, der Geist aber macht lebendig“ (2 Kor 3,6). „Der Sabbat wurde für den Menschen gemacht“ (Mk 2,27).",stellen:"2 Kor 3,6; Mk 2,27; Mt 23,23; Gal 3,3",bsp:"Gesetzlichkeit. Moral als Kern des Glaubens. Streit um die richtige Form statt um die Sache."},
  en:{label:"The letter",say:"“Whoever keeps all the rules is righteous.”",wahr:"Commandments protect and give life a form.",kippt:"The rule becomes the goal. “The letter kills, but the Spirit gives life” (2 Cor 3:6). “The Sabbath was made for humankind” (Mark 2:27).",stellen:"2 Cor 3:6; Mark 2:27; Matt 23:23; Gal 3:3",bsp:"Legalism. Morality as the core of faith. Fighting over the correct form instead of the matter itself."}},
 {id:"leib",k:"B",x:.6,y:.9,links:[wp("Askese","Asceticism"),wp("Johannes Cassianus","John Cassian"),W.seuse],
  de:{label:"Den Leib bezwingen",say:"„Je härter ich gegen mich bin, desto näher bin ich Gott.“",wahr:"Fasten und Verzicht haben ihren Ort.",kippt:"Härte gegen den Leib hat nur „den Schein von Weisheit“ (Kol 2,23). Seuse quälte sich jahrelang und hörte dann, er solle damit aufhören. Die Wüstenväter stellen die Unterscheidung über die Strenge.",stellen:"Kol 2,23; 1 Tim 4,4; Cassian, Unterredungen II; Seuse, Vita",bsp:"Selbstgeißelung. Selbsthass in frommem Gewand.",own:{bew:"Maß halten und milde mit sich sein. Alles, was Gott geschaffen hat, ist gut (1 Tim 4,4)."}},
  en:{label:"Subduing the body",say:"“The harder I am on myself, the closer I am to God.”",wahr:"Fasting and renunciation have their place.",kippt:"Severity to the body has only “an appearance of wisdom” (Col 2:23). Suso tormented himself for years and was then told to stop. The Desert Fathers rank discernment above austerity.",stellen:"Col 2:23; 1 Tim 4:4; Cassian, Conferences II; Suso, Life",bsp:"Self-flagellation. Self-hatred in pious clothing.",own:{bew:"Keep measure and be gentle with yourself. Everything created by God is good (1 Tim 4:4)."}}},
 {id:"ohneliebe",k:"F",x:.2,y:.32,links:[W.eckhart,W.teresa],
  de:{label:"Erkenntnis ohne Liebe",say:"„Ich habe es verstanden. Die anderen sind noch nicht so weit.“",wahr:"Erkenntnis ist eine Gabe des Geistes (1 Kor 12,8).",kippt:"„Wenn ich alle Erkenntnis hätte, hätte aber die Liebe nicht, wäre ich nichts“ (1 Kor 13,2). Eckhart: Wer in Verzückung ist und weiß, dass ein Kranker eine Suppe braucht, soll die Verzückung lassen.",stellen:"1 Kor 13,2; 1 Kor 8,1; 1 Joh 4,20; Eckhart, Reden der Unterweisung 10; Teresa von Ávila, Innere Burg VII,4 („Werke, Werke“)",bsp:"Kalte Rechtgläubigkeit. Kontemplativer Rückzug ohne Blick für den Nächsten."},
  en:{label:"Knowledge without love",say:"“I have understood it. The others aren’t that far yet.”",wahr:"Knowledge is a gift of the Spirit (1 Cor 12:8).",kippt:"“If I have all knowledge but do not have love, I am nothing” (1 Cor 13:2). Eckhart: if you are in rapture and know that a sick person needs soup, leave the rapture.",stellen:"1 Cor 13:2; 1 Cor 8:1; 1 John 4:20; Eckhart, Talks of Instruction 10; Teresa of Ávila, Interior Castle VII.4 (“works, works”)",bsp:"Cold orthodoxy. Contemplative withdrawal with no eye for one’s neighbour."}}
];

  svg.appendChild(el("text",{x:500,y:972,class:"axislbl","text-anchor":"middle"},S.b));
  svg.appendChild(el("text",{x:500,y:990,class:"axissub","text-anchor":"middle"},S.bs));
  svg.appendChild(el("circle",{cx:500,cy:500,r:92,fill:"var(--surface)"}));
  svg.appendChild(el("circle",{cx:500,cy:500,r:92,fill:"var(--accent)","fill-opacity":".12",stroke:"var(--accent)","stroke-width":"1.5"}));
  const cs="font-family:var(--display);font-size:18px;font-weight:700;fill:var(--accent)";
  S.c.forEach((line,i)=>svg.appendChild(el("text",{x:500,y:478+i*23,"text-anchor":"middle",style:cs},line)));
  svg.appendChild(el("text",{x:500,y:554,"text-anchor":"middle",style:"font-size:12px;fill:var(--accent)"},lang==="de"?"Gal 2,20":"Gal 2:20"));
  E.forEach(e=>{
    const [cx,cy]=P(e.x,e.y);const left=cx>760;
    const g=el("g",{class:"node",tabindex:0,role:"button","data-id":e.id,"aria-label":T(e).label});
    g.appendChild(el("circle",{cx,cy,r:8,fill:`var(--c${e.k})`,stroke:"var(--surface)","stroke-width":2}));
    g.appendChild(el("text",{x:left?cx-14:cx+14,y:cy+5,"text-anchor":left?"end":"start"},T(e).label));
    g.addEventListener("click",()=>select(e.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select(e.id)}});
    svg.appendChild(g);
  });
  svgTitles();refresh();
}
function refresh(){
  svg.querySelectorAll(".node").forEach(g=>{const e=E.find(x=>x.id===g.dataset.id);g.classList.toggle("dim",!!active&&e.k!==active);g.classList.toggle("sel",e.id===selected)});
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.k===(active??"")?"true":"false"));
}
function vert(e){const v=STR[lang].vert;return e.y<-.35?v[0]:e.y>.35?v[1]:v[2]}
function linkList(e){return `<ul class="links">${e.links.map(l=>`<li><a href="${l[lang][1]}" target="_blank" rel="noopener">${l[lang][0]}</a></li>`).join("")}</ul>`}
function body(e,withQ){const t=T(e),c=C(e.k),S=STR[lang],D=S.dt,o=t.own||{},tag=x=>" · "+(x?S.own:S.cls);
  return `<p class="say">${t.say}</p><dl class="dl">
  <div><dt>${D.wahr}</dt><dd>${t.wahr}</dd></div>
  <div><dt>${D.kippt}</dt><dd>${t.kippt}</dd></div>
  <div><dt>${D.stellen}</dt><dd>${t.stellen}</dd></div>
  <div><dt>${D.bsp}</dt><dd>${t.bsp}</dd></div>
  ${withQ?`<div><dt>${D.q}</dt><dd><i>${c.q}</i></dd></div>`:""}
  <div><dt>${D.bew}${tag(o.bew)}</dt><dd>${o.bew||c.bew}</dd></div>
  <div><dt>${D.vert}</dt><dd>${vert(e)}</dd></div>
  <div><dt>${D.links}</dt><dd>${linkList(e)}</dd></div></dl>`}
function select(id){
  selected=id;const e=E.find(x=>x.id===id);const c=C(e.k),S=STR[lang];const p=$("panel");
  p.innerHTML=`<div class="cls" style="color:var(--c${e.k})">${S.cls} ${e.k} · ${c.name}</div><h3>${T(e).label}</h3>${body(e,true)}`;
  enrich(p);refresh();
}
function renderStatic(){
  const S=STR[lang];
  document.documentElement.lang=lang;document.title=S.title;
  $("s-eyebrow").textContent=S.eyebrow;$("s-h1").textContent=S.h1;
  $("s-intro1").textContent=S.intro1;$("s-intro2").textContent=S.intro2;
  $("h-mitte").textContent=S.hMitte;$("s-m1").textContent=S.m1;$("s-m2").textContent=S.m2;$("s-m3").textContent=S.m3;
  $("h-basis").textContent=S.hBasis;
  $("s-sources").innerHTML=S.sources.map(([b,s])=>`<div class="src"><b>${b}</b><span>${s}</span></div>`).join("");
  $("s-basishint").textContent=S.basisHint;
  $("h-karte").textContent=S.hKarte;$("filters").setAttribute("aria-label",S.filterLabel);
  $("s-maphint").textContent=S.mapHint;
  $("h-klassen").textContent=S.hKlassen;$("s-kl1").textContent=S.kl1;
  $("h-katalog").textContent=S.hKatalog;$("h-spannung").textContent=S.hSpannung;
  $("s-t1").textContent=S.t1;$("s-t2").textContent=S.t2;$("s-t3").textContent=S.t3;
  $("s-foot1").innerHTML=S.foot1;$("s-foot2").innerHTML=S.foot2;
}
function renderLists(){
  const S=STR[lang],D=S.dt;
  const f=$("filters");f.innerHTML="";
  const all=document.createElement("button");all.className="chip";all.dataset.k="";all.textContent=S.all;all.onclick=()=>{active=null;refresh()};f.appendChild(all);
  Object.keys(CLASSES).forEach(k=>{const b=document.createElement("button");b.className="chip";b.dataset.k=k;b.innerHTML=`<i style="background:var(--c${k})"></i>${k} · ${C(k).name}`;b.onclick=()=>{active=active===k?null:k;refresh()};f.appendChild(b)});
  const cl=$("classes");cl.innerHTML="";
  Object.keys(CLASSES).forEach(k=>{const c=C(k);const d=document.createElement("div");d.className="klass";d.style.setProperty("--c",`var(--c${k})`);
    d.innerHTML=`<div class="tag">${k} · ${c.sub}</div><h3>${c.name}</h3><p>${c.mech}</p><dl class="dl"><div><dt>${D.q}</dt><dd><i>${c.q}</i></dd></div><div><dt>${D.erk}</dt><dd>${c.erk}</dd></div><div><dt>${D.bew}</dt><dd>${c.bew}</dd></div></dl><p class="meta">${S.canon}: ${c.kanon} · ${E.filter(e=>e.k===k).length} ${S.entries}</p>`;cl.appendChild(d)});
  const cat=$("catalog");cat.innerHTML="";
  Object.keys(CLASSES).forEach(k=>{
    const g=document.createElement("div");g.className="group";
    g.innerHTML=`<h3><i style="background:var(--c${k})"></i>${k} · ${C(k).name}</h3><p class="gq">${C(k).q}</p><div class="items">${E.filter(e=>e.k===k).map(e=>`<article class="item"><h4>${T(e).label}</h4>${body(e,false)}<button type="button" data-id="${e.id}">${S.show}</button></article>`).join("")}</div>`;
    cat.appendChild(g);
  });
}
function render(){
  tip.hidden=true;
  renderStatic();renderLists();drawMap();
  enrich(document.querySelector(".wrap"));
  select(selected);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
}
function setLang(l){if(l===lang)return;lang=l;try{localStorage.setItem("lang",l)}catch(_){}render()}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
$("catalog").addEventListener("click",ev=>{const b=ev.target.closest("button[data-id]");if(!b)return;active=null;select(b.dataset.id);$("h-karte").scrollIntoView({behavior:"smooth"})});
try{const s=localStorage.getItem("lang");if(s==="en"||s==="de")lang=s}catch(_){}
document.body.appendChild(tip);
render();
</script>

</body></html>
