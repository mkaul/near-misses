 A:{de:{name:"Etwas Festes daraus machen",sub:"festhalten",q:"Suche ich etwas Bleibendes, das ich „eigentlich“ bin?",mech:"Aus einem Erlebnis von Weite oder Stille wird ein Ding gemacht: ein Urgrund, ein ewiges Ich.",erk:"Auch das Schönste, was ich erlebe, kommt und geht. Was kommt und geht, muss ich nicht zu meinem Ich erklären.",bew:"Das Erlebte gelten lassen, ohne ein Schild „Das bin ich“ daranzuhängen. Dabei nicht ins Gegenteil kippen („dann gibt es eben gar nichts“)."},
    en:{name:"Turning it into a thing",sub:"clinging",q:"Am I looking for something lasting that I “really” am?",mech:"An experience of spaciousness or stillness is turned into a thing: a ground of being, an eternal me.",erk:"Even the most beautiful thing I experience comes and goes. What comes and goes I don’t have to declare to be me.",bew:"Let the experience stand without hanging a sign on it that says “This is me”. And don’t tip into the opposite (“then there’s nothing at all”)."}},
 B:{de:{name:"Alles wegwischen",sub:"wegschieben",q:"Wird aus „Ich bin nicht so fest, wie ich dachte“ ein „Nichts zählt“?",mech:"Aus einer befreienden Entdeckung wird eine Behauptung: Nichts ist echt, nichts hat Folgen.",erk:"Auch wenn nichts für immer bleibt, hat alles Wirkung. Was ich tue, kommt bei anderen an.",bew:"Hinschauen, was mein Tun bewirkt. Sich zuwenden statt abwenden."},
    en:{name:"Wiping it all away",sub:"pushing away",q:"Does “I’m not as solid as I thought” turn into “Nothing matters”?",mech:"A freeing discovery becomes a claim: nothing is real, nothing has consequences.",erk:"Even if nothing lasts for ever, everything has effects. What I do lands with other people.",bew:"Look at what my actions bring about. Turn towards, not away."}},
 C:{de:{name:"Die große Wahrheit als Ausrede",sub:"groß gedacht, klein gedrückt",q:"Benutze ich einen großen Satz, um mich vor etwas Kleinem zu drücken: einer Entschuldigung, einer Abmachung, einem Gespräch?",mech:"Eine Einsicht, die im Großen stimmt, wird benutzt, um den Alltag außer Kraft zu setzen: Anstand, Verantwortung, Üben.",erk:"Die große Sicht hebt den Alltag nicht auf. Sie zeigt sich gerade darin, wie ich mit Menschen umgehe.",bew:"Vom Gipfel absteigen und die Einsicht ins Verhalten übersetzen. Vorher Geschirr spülen, nachher Geschirr spülen."},
    en:{name:"The big truth as an excuse",sub:"thinking big, ducking small",q:"Am I using a big sentence to duck something small: an apology, an agreement, a conversation?",mech:"An insight that holds on the grand scale is used to suspend everyday life: decency, responsibility, practice.",erk:"The big view doesn’t cancel everyday life. It shows precisely in how I treat people.",bew:"Come down from the summit and translate the insight into behaviour. Before: wash the dishes. After: wash the dishes."}},
 D:{de:{name:"Das Werkzeug fürs Ziel halten",sub:"im Hilfsmittel wohnen",q:"Ist mir ein Zustand, eine Methode oder ein Fortschrittsplan wichtiger geworden als das, wofür sie gut sind?",mech:"Ein Hilfsmittel wird zum Wohnort.",erk:"Jeder Zustand geht vorbei, jede Methode ist nur ein Fahrzeug. Wer am anderen Ufer ankommt, trägt das Boot nicht weiter auf dem Rücken.",bew:"Fragen: Wozu mache ich das? Und loslassen, was seinen Dienst getan hat."},
    en:{name:"Mistaking the tool for the goal",sub:"living in the aid",q:"Has a state, a method or a progress plan become more important to me than what it is for?",mech:"An aid becomes a place to live.",erk:"Every state passes; every method is only a vehicle. Once you reach the other shore, you don’t carry the boat on your back.",bew:"Ask: what am I doing this for? And let go of what has done its job."}},
 E:{de:{name:"Das Ego im neuen Gewand",sub:"Einsicht als Besitz",q:"Wer ist hier eigentlich stolz? Erzähle ich davon, um besser dazustehen?",mech:"Das Ego zieht in die Einsicht ein, die es kleiner machen sollte, und wohnt dort bequemer als vorher.",erk:"Eine Einsicht gehört niemandem. Das Gefühl „Ich hab’s“ überlebt jede Einsicht.",bew:"Nachsehen, wer da etwas haben will. Den Besitzer anschauen, statt den Besitz zu polieren."},
    en:{name:"The ego in new clothes",sub:"insight as property",q:"Who exactly is proud here? Am I telling this to look better?",mech:"The ego moves into the very insight that was meant to shrink it, and lives there more comfortably than before.",erk:"An insight belongs to no one. The feeling “I’ve got it” survives every insight.",bew:"Look at who wants to have something here. Examine the owner instead of polishing the possession."}},
 F:{de:{name:"Kalt statt gelassen",sub:"ausweichen statt fühlen",q:"Bin ich gelassen oder nur taub? Fühle ich, oder weiche ich aus?",mech:"Abstumpfen oder Ausweichen sieht von außen aus wie Ruhe.",erk:"Was wehtut, darf wehtun. Es entfällt nur das Drama obendrauf. Gelassenheit ist warm, Gleichgültigkeit kalt.",bew:"Hinfühlen statt Abstand nehmen. Freundlichkeit und Mitgefühl üben, auch sich selbst gegenüber."},
    en:{name:"Cold instead of calm",sub:"dodging instead of feeling",q:"Am I calm or just numb? Am I feeling, or dodging?",mech:"Numbing out or dodging looks like peace from the outside.",erk:"What hurts is allowed to hurt. Only the drama on top falls away. Calm is warm, indifference is cold.",bew:"Feel into it instead of stepping back. Practise kindness and compassion, towards yourself too."}},
 G:{de:{name:"Ein Stück herausgepickt",sub:"der Rest fehlt",q:"Habe ich mir nur das angenehme Stück herausgenommen? Was habe ich weggelassen?",mech:"Ein Teil wird aus dem Zusammenhang gelöst und für andere Zwecke eingespannt.",erk:"Die Teile tragen einander: klar sehen, anständig leben, regelmäßig üben. Ein Stück allein führt woandershin.",bew:"Fragen, was fehlt, und es wieder dazunehmen."},
    en:{name:"One piece picked out",sub:"the rest is missing",q:"Have I only taken the pleasant piece? What did I leave out?",mech:"One part is lifted out of its context and harnessed to other purposes.",erk:"The parts carry each other: seeing clearly, living decently, practising regularly. One piece alone leads somewhere else.",bew:"Ask what is missing and put it back."}}
};

const E=[
 {id:"glas",k:"A",x:-.8,y:-.05,links:[L.kyra,L.kastrup,L.tollifson,wp("Nondualität","Nondualism")],
  de:{label:"Das eine große Bewusstsein",say:"„Hinter allem steckt ein einziges Bewusstsein, und das bin ich in Wahrheit.“",wahr:"Wer genau hinschaut, findet keine Grenze, an der „ich“ aufhört und „die Welt“ anfängt.",kippt:"Aus „keine Grenze gefunden“ wird „es gibt ein großes Etwas, das wir alle sind“. Das ist ein Schluss, kein Erlebnis. Niemand steht außerhalb und kann nachzählen, dass es eins ist.",heute:"Das Bild vom Raum im Glas, der „in Wahrheit“ der Raum des Universums ist. „Wir sind alle eins“ als Weltformel."},
  en:{label:"The one big consciousness",say:"“Behind everything there is one single consciousness, and that is what I really am.”",wahr:"If you look closely, you find no border where “I” ends and “the world” begins.",kippt:"“No border found” becomes “there is one big something that we all are”. That is a conclusion, not an experience. Nobody stands outside and can count that it is one.",heute:"The image of the space in a jar that is “in fact” the space of the universe. “We are all one” as a formula for everything."}},
 {id:"perennial",k:"G",x:-.62,y:.13,links:[wp("Philosophia perennis","Perennial philosophy"),wpEn("Spiritual but not religious")],
  de:{label:"Alle meinen dasselbe",say:"„Alle Religionen und Weisheitslehren sagen im Kern dasselbe.“",wahr:"Es gibt echte Gemeinsamkeiten, und Respekt vor anderen Wegen ist gut.",kippt:"Die Unterschiede werden glattgebügelt, obwohl gerade sie etwas zu sagen haben. Die einen suchen ein ewiges Selbst, die anderen sagen, es gebe keins. Das ist nicht dasselbe.",heute:"Zitat-Kacheln, die Rumi, Buddha und Einstein in einen Topf werfen. „Viele Wege, ein Gipfel.“",own:{bew:"Erst genau hinhören, was jeweils gesagt wird, und dann vergleichen."}},
  en:{label:"They all mean the same",say:"“All religions and wisdom teachings say the same thing at heart.”",wahr:"There are real overlaps, and respect for other paths is good.",kippt:"The differences are ironed flat, although they are the very thing that has something to say. Some look for an eternal self, others say there is none. That is not the same.",heute:"Quote cards that throw Rumi, the Buddha and Einstein into one pot. “Many paths, one summit.”",own:{bew:"First listen closely to what each one actually says, then compare."}}},
 {id:"karma",k:"A",x:-.88,y:.5,links:[wp("Gerechte-Welt-Glaube","Just-world fallacy"),wp("Täter-Opfer-Umkehr","Victim blaming"),L.grey],
  de:{label:"Karma als Abrechnung",say:"„Das hast du dir in einem früheren Leben eingebrockt.“",wahr:"Was ich tue, hat Folgen, und ich bin dafür verantwortlich.",kippt:"Aus Verantwortung wird eine kosmische Buchhaltung, die Unglück zur verdienten Strafe erklärt. Das trifft vor allem Kranke und Opfer. Nicht alles, was geschieht, ist eine Quittung.",heute:"„Karma regelt das.“ Krankheit als „Lernaufgabe der Seele“. „Du hast dir deine Eltern ausgesucht.“",own:{bew:"Weg von der Frage „Womit habe ich das verdient?“ und hin zu „Was will ich jetzt tun?“"}},
  en:{label:"Karma as a bill",say:"“You brought this on yourself in a past life.”",wahr:"What I do has consequences, and I am responsible for it.",kippt:"Responsibility turns into cosmic bookkeeping that declares misfortune a deserved punishment. This hits the sick and the victims hardest. Not everything that happens is a receipt.",heute:"“Karma will sort it out.” Illness as “the soul’s lesson”. “You chose your parents.”",own:{bew:"Away from “What did I do to deserve this?” and towards “What do I want to do now?”"}}},
 {id:"selbst",k:"A",x:-.35,y:-.42,links:[wp("Höheres Selbst","Higher self"),wp("Authentizität","Authenticity (philosophy)")],
  de:{label:"Mein wahres Selbst",say:"„Tief in mir gibt es ein wahres Selbst, das ich nur freilegen muss.“",wahr:"Man kann sich selbst näherkommen und weniger verstellt leben.",kippt:"Aus dem Vertrauen „Ich kann aufwachen“ wird ein fester Kern, den man besitzen kann. Dann sucht man jahrelang nach etwas, das sich nie zeigt, weil es kein Ding ist.",heute:"Kurse nach dem Muster „Finde dein wahres Ich“. „Sei einfach du selbst“ als Heilsversprechen. Das „höhere Selbst“."},
  en:{label:"My true self",say:"“Deep inside me there is a true self that I only have to uncover.”",wahr:"You can get closer to yourself and live with less pretence.",kippt:"The confidence “I can wake up” turns into a solid core that can be owned. Then you spend years searching for something that never shows up, because it is not a thing.",heute:"Courses along the lines of “Find your true self”. “Just be yourself” as a promise of salvation. The “higher self”."}},
 {id:"manifest",k:"A",x:-.85,y:-.5,links:[wp("Gesetz der Anziehung","Law of attraction (New Thought)"),wp("Magisches Denken","Magical thinking"),L.rankin],
  de:{label:"Das Universum liefert",say:"„Meine Gedanken erschaffen meine Wirklichkeit.“",wahr:"Wie ich denke, färbt, was ich erlebe und wie ich handle.",kippt:"Aus „Gedanken prägen mein Erleben“ wird „Wünsche steuern die Welt“. Das macht aus innerer Arbeit Wunschdenken. Und wer krank oder arm ist, ist dann angeblich selbst schuld.",heute:"„Manifestieren“ auf TikTok und Instagram. „The Secret“. Bestellungen beim Universum.",own:{bew:"Das Wünschen selbst anschauen: Was will ich da eigentlich unbedingt haben?"}},
  en:{label:"The universe delivers",say:"“My thoughts create my reality.”",wahr:"How I think colours what I experience and how I act.",kippt:"“Thoughts shape my experience” becomes “wishes steer the world”. That turns inner work into wishful thinking. And whoever is ill or poor is then supposedly to blame.",heute:"“Manifesting” on TikTok and Instagram. “The Secret”. Placing orders with the universe.",own:{bew:"Look at the wishing itself: what is it that I so badly want to have?"}}},
 {id:"jetzt",k:"D",x:-.42,y:-.62,links:[wp("Eckhart Tolle","Eckhart Tolle"),wp("Jetzt! Die Kraft der Gegenwart","The Power of Now")],
  de:{label:"Nur das Jetzt zählt",say:"„Sei einfach im Hier und Jetzt, mehr braucht es nicht.“",wahr:"Wer gegenwärtig ist, grübelt weniger und sieht klarer.",kippt:"Der Augenblick wird zum Wohnort gemacht, den man festhalten will. Aber auch das Jetzt kommt und geht. Und Planen, Erinnern und Verantwortung für morgen gehören zum Leben.",heute:"„Lebe im Jetzt“ als Antwort auf alles. Präsenz als Dauerzustand, den man „halten“ muss. Bestimmte Lesarten von Eckhart Tolles „Jetzt!“.",own:{bew:"Den Augenblick anschauen, statt sich darin einzurichten: Was taucht gerade auf, was vergeht?"}},
  en:{label:"Only the Now counts",say:"“Just be in the here and now; nothing else is needed.”",wahr:"When you are present, you ruminate less and see more clearly.",kippt:"The moment is turned into a home that you try to hold on to. But the Now comes and goes too. And planning, remembering and responsibility for tomorrow are part of life.",heute:"“Live in the Now” as the answer to everything. Presence as a permanent state you have to “hold”. Certain readings of Eckhart Tolle’s “The Power of Now”.",own:{bew:"Look at the moment instead of settling into it: what is showing up right now, what is passing?"}}},
 {id:"gott",k:"E",x:-.65,y:-.8,links:[L.gindin,L.bates,wp("Größenwahn","Grandiosity")],
  de:{label:"Ich bin Gott",say:"„Ich bin das Ganze. Ich bin reines Bewusstsein.“",wahr:"Das Gefühl, von nichts getrennt zu sein, gibt es wirklich.",kippt:"Den Satz spricht ausgerechnet das Ich, das sich damit größer macht als je zuvor. Aus „nicht getrennt“ wird „ich bin etwas Besonderes“.",heute:"„Erwacht“ in der Profilbeschreibung. Lehrer, die keinen Widerspruch dulden. Größengefühle nach Retreats oder Psychedelika."},
  en:{label:"I am God",say:"“I am the whole. I am pure consciousness.”",wahr:"The feeling of not being separate from anything is real.",kippt:"The sentence is spoken by the very I that makes itself bigger than ever with it. “Not separate” becomes “I am something special”.",heute:"“Awakened” in the profile bio. Teachers who tolerate no contradiction. Feelings of grandeur after retreats or psychedelics."}},
 {id:"schon",k:"C",x:-.22,y:-.7,links:[wp("Neo-Advaita","Neo-Advaita")],
  de:{label:"Schon angekommen",say:"„Du bist schon vollkommen, also gibt es nichts zu üben.“",wahr:"Es muss nichts hinzugefügt werden. Was gesucht wird, ist nicht woanders.",kippt:"Aus einem Hinweis wird eine Ausrede. Ein Satz, der auf etwas zeigt, ersetzt nicht das Hinschauen. Wer nur den Satz hat, hat eine Meinung, keine Erfahrung.",heute:"„Du musst nichts tun, du bist schon da“ als Werbeversprechen. Erleuchtung am Wochenende. Buchtitel wie „Jeder ist schon erleuchtet“ sind als Hinweis gemeint und kippen erst, wenn sie das Üben ersetzen."},
  en:{label:"Already there",say:"“You are already perfect, so there is nothing to practise.”",wahr:"Nothing needs to be added. What is sought is not somewhere else.",kippt:"A pointer becomes an excuse. A sentence that points at something does not replace looking. If you only have the sentence, you have an opinion, not an experience.",heute:"“You don’t have to do anything, you’re already there” as an advertising promise. Enlightenment in a weekend. Book titles like “Everyone is already enlightened” are meant as pointers and only tip over when they replace practice."}},
 {id:"regeln",k:"C",x:.05,y:-.92,links:[wpEn("Crazy wisdom"),L.grey,wp("Machtmissbrauch","Abuse of power")],
  de:{label:"Für mich gelten keine Regeln",say:"„Wer erwacht ist, steht über Gut und Böse.“",wahr:"Wer klar sieht, braucht weniger äußeren Zwang, um anständig zu sein.",kippt:"Daraus wird ein Freibrief. Wirkliche Klarheit zeigt sich daran, dass jemand weniger Schaden anrichtet, nicht mehr.",heute:"Lehrer, die Übergriffe als „Lektion“ oder „verrückte Weisheit“ ausgeben. „Das ist nur dein Ego, das sich beschwert.“"},
  en:{label:"Rules don’t apply to me",say:"“Whoever is awake stands beyond good and evil.”",wahr:"Someone who sees clearly needs less outside pressure to behave decently.",kippt:"This becomes a licence. Real clarity shows in someone doing less harm, not more.",heute:"Teachers who pass off abuse as a “lesson” or “crazy wisdom”. “That’s just your ego complaining.”"}},
 {id:"niemand",k:"C",x:.55,y:-.78,links:[L.parsons,L.accounts,wp("Neo-Advaita","Neo-Advaita")],
  de:{label:"Da ist niemand",say:"„Es gibt niemanden, der etwas tun könnte. Alles geschieht einfach.“",wahr:"Vieles geschieht tatsächlich ohne einen kleinen Chef im Kopf.",kippt:"Daraus wird: Üben ist sinnlos, Verantwortung eine Illusion. Aber auch ohne Chef im Kopf wird weiter entschieden, versprochen und verletzt.",heute:"„Wer ist denn da, der üben könnte?“ als Antwort auf jede Frage. Treffen, bei denen jede Frage nach dem Wie abgewiesen wird."},
  en:{label:"Nobody here",say:"“There is no one who could do anything. Everything just happens.”",wahr:"A lot really does happen without a little boss in the head.",kippt:"This becomes: practice is pointless, responsibility an illusion. But even without a boss in the head, people go on deciding, promising and hurting.",heute:"“Who is there that could practise?” as the answer to every question. Meetings where every question about how is turned away."}},
 {id:"vibes",k:"F",x:.15,y:-.5,links:[wp("Spiritual Bypassing","Spiritual bypass"),wp("Toxische Positivität","Toxic positivity"),L.rankin],
  de:{label:"Good vibes only",say:"„Das sind nur Gedanken. Lass es einfach los.“",wahr:"Man muss nicht jedem Gefühl glauben und folgen.",kippt:"Was nie gefühlt wurde, ist nicht losgelassen, sondern weggedrückt. Es kommt wieder, meist an der falschen Stelle.",heute:"„Good vibes only.“ Trauernden sagen, alles habe seinen Sinn. Meditieren statt des fälligen Gesprächs."},
  en:{label:"Good vibes only",say:"“Those are just thoughts. Simply let it go.”",wahr:"You don’t have to believe and follow every feeling.",kippt:"What was never felt has not been let go of but pushed down. It comes back, usually in the wrong place.",heute:"“Good vibes only.” Telling the bereaved that everything happens for a reason. Meditating instead of having the overdue conversation."}},
 {id:"wellness",k:"G",x:.25,y:-.38,links:[wpEn("McMindfulness"),wp("Achtsamkeit (mindfulness)","Mindfulness")],
  de:{label:"Achtsamkeit als Wellness",say:"„Zehn Minuten am Tag, und du bist entspannter und leistungsfähiger.“",wahr:"Achtsamkeit beruhigt wirklich und hilft bei Stress.",kippt:"Herausgepickt ist die Technik. Weggelassen sind die Fragen, wie ich lebe und was ich eigentlich will. Dann hilft sie vor allem, besser zu funktionieren, auch in Verhältnissen, die krank machen.",heute:"Meditations-Apps mit Serien-Zähler. Achtsamkeitskurse, damit das Team mehr schafft."},
  en:{label:"Mindfulness as wellness",say:"“Ten minutes a day and you’ll be more relaxed and more productive.”",wahr:"Mindfulness really does calm you and helps with stress.",kippt:"The technique has been picked out. Left out are the questions of how I live and what I actually want. Then it mostly helps you function better, even in conditions that make people ill.",heute:"Meditation apps with streak counters. Mindfulness courses so the team gets more done."}},
 {id:"illusion",k:"B",x:.9,y:-.15,links:[wp("Simulationshypothese","Simulation hypothesis"),L.tollifson],
  de:{label:"Alles nur Illusion",say:"„Nichts ist wirklich echt.“",wahr:"Die Dinge sind weniger fest und weniger getrennt, als sie aussehen.",kippt:"„Nicht so fest wie gedacht“ heißt nicht „nicht vorhanden“. Der Schmerz des anderen ist echt genug.",heute:"„Ist doch alles nur ein Traum.“ „Wir leben eh in einer Simulation“ als Schulterzucken."},
  en:{label:"It’s all illusion",say:"“Nothing is really real.”",wahr:"Things are less solid and less separate than they look.",kippt:"“Not as solid as I thought” does not mean “not there”. The other person’s pain is real enough.",heute:"“It’s all just a dream.” “We’re living in a simulation anyway” as a shrug."}},
 {id:"egal",k:"B",x:.92,y:-.55,links:[wp("Nihilismus","Nihilism"),wp("Zynismus","Cynicism (contemporary)")],
  de:{label:"Ist doch eh alles egal",say:"„Nichts hat Sinn, also ist es gleich, was ich tue.“",wahr:"Ernüchterung kann befreien. Vieles, dem man nachgerannt ist, verliert seinen Glanz.",kippt:"Ernüchterung macht leichter, Nihilismus macht bitter. Und „nichts hat Wert“ ist selbst wieder eine steile Behauptung über die Welt.",heute:"Zynismus als Zeichen von Reife. Doomscrolling mit „bringt eh nichts“. „Optimistischer Nihilismus“ als Lebensgefühl."},
  en:{label:"Nothing matters anyway",say:"“Nothing has meaning, so it makes no difference what I do.”",wahr:"Disenchantment can be freeing. Much of what you chased loses its shine.",kippt:"Disenchantment makes you lighter; nihilism makes you bitter. And “nothing has value” is itself a bold claim about the world.",heute:"Cynicism as a sign of maturity. Doomscrolling with “no point anyway”. “Optimistic nihilism” as a mood."}},
 {id:"gehirn",k:"B",x:.82,y:.0,links:[wp("Reduktionismus","Reductionism"),wp("Szientismus","Scientism")],
  de:{label:"Alles nur Gehirnchemie",say:"„Das Ich ist eine Illusion des Gehirns, und mit dem Tod ist Schluss. Mehr gibt es nicht zu sagen.“",wahr:"Nüchternheit schützt vor Wunschdenken.",kippt:"Aus „Ich weiß es nicht“ wird „Ich weiß, dass da nichts ist“. Das ist auch eine Gewissheit, nur mit umgekehrtem Vorzeichen.",heute:"Meditation als reines Gehirntraining. „Liebe ist nur Oxytocin.“",own:{bew:"Die Frage offen lassen können, ohne sie mit Ja oder Nein zu schließen."}},
  en:{label:"It’s all brain chemistry",say:"“The self is an illusion of the brain, and death is the end. There is nothing more to say.”",wahr:"Sobriety protects against wishful thinking.",kippt:"“I don’t know” becomes “I know there is nothing there”. That is a certainty too, only with the sign reversed.",heute:"Meditation as pure brain training. “Love is just oxytocin.”",own:{bew:"Be able to leave the question open without closing it with a yes or a no."}}},
 {id:"taub",k:"F",x:.65,y:.4,links:[L.cheetah,wp("Depersonalisation","Depersonalization"),L.accounts,L.chapin,L.study],
  de:{label:"Nichts mehr fühlen",say:"„Mich berührt nichts mehr. Ich bin frei.“",wahr:"Gelassenheit gibt es wirklich.",kippt:"Taubheit ist keine Freiheit. Wenn sich alles unwirklich oder wie hinter Glas anfühlt, ist das ein Warnzeichen, kein Fortschritt.",heute:"Nach intensiven Retreats oder sehr viel Meditation: sich fremd fühlen, nichts mehr spüren und das für Erwachen halten.",own:{bew:"Nicht weiter vertiefen, sondern erden: Körper, Bewegung, Menschen treffen. Wenn es anhält, Hilfe suchen, ärztlich oder psychotherapeutisch."}},
  en:{label:"Feeling nothing any more",say:"“Nothing touches me any more. I am free.”",wahr:"Calm is real.",kippt:"Numbness is not freedom. When everything feels unreal or as if behind glass, that is a warning sign, not progress.",heute:"After intensive retreats or a great deal of meditation: feeling like a stranger, feeling nothing, and taking that for awakening.",own:{bew:"Don’t go deeper; ground yourself instead: body, movement, seeing people. If it persists, get help from a doctor or therapist."}}},
 {id:"ego",k:"B",x:.5,y:.88,links:[wpEn("Ego death")],
  de:{label:"Das Ego muss weg",say:"„Mein Ego ist der Feind. Ich muss es besiegen.“",wahr:"Weniger um sich selbst zu kreisen tut gut.",kippt:"Wer gegen sich kämpft, hat zwei Egos: eins, das kämpft, und eins, das verliert. Der Wunsch, nicht zu sein, ist auch nur ein Wunsch, und kein freundlicher.",heute:"„Ego-Tod“ als Ziel von Psychedelika-Reisen. Selbstoptimierung mit Härte. Sich für jedes bisschen „Ego“ beschimpfen.",own:{bew:"Den Kampf beenden. Dem, was auftaucht, freundlich begegnen, auch dem eigenen Stolz."}},
  en:{label:"The ego has to go",say:"“My ego is the enemy. I have to defeat it.”",wahr:"Revolving around yourself less does you good.",kippt:"Whoever fights themselves has two egos: one that fights and one that loses. The wish not to be is also just a wish, and not a kind one.",heute:"“Ego death” as the goal of psychedelic trips. Self-optimisation with harshness. Scolding yourself for every bit of “ego”.",own:{bew:"End the fight. Meet whatever shows up with kindness, your own pride included."}}},
 {id:"sport",k:"D",x:.1,y:.78,links:[wp("Gamification","Gamification"),wp("Selbstoptimierung","Self-help")],
  de:{label:"Erleuchtung als Leistungssport",say:"„Ich bin jetzt auf Stufe drei. Nächstes Jahr schaffe ich vier.“",wahr:"Ernsthaftigkeit und genaue Beschreibungen helfen.",kippt:"Landkarten beschreiben den Weg, sie sind keine Medaillen. Wer Stufen sammelt, übt vor allem das Sammeln.",heute:"Serien-Zähler in Apps. Retreat-Stunden wie ein Lebenslauf. Foren, in denen Stufen verglichen werden."},
  en:{label:"Awakening as a sport",say:"“I’m at stage three now. Next year I’ll make four.”",wahr:"Earnestness and precise descriptions help.",kippt:"Maps describe the way; they are not medals. Whoever collects stages is mostly practising collecting.",heute:"Streak counters in apps. Retreat hours like a CV. Forums where stages are compared."}},
 {id:"trophy",k:"E",x:-.2,y:.62,links:[wpEn("Spiritual materialism"),L.delong],

const T=e=>e[lang];
let lang=(()=>{try{const q=new URLSearchParams(location.search).get("lang")||localStorage.getItem("lang");return q==="en"?"en":"de"}catch(_){return"de"}})();

/* ---------- rendering ---------- */
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("map");
const P=(x,y)=>[500+x*400,500+y*400];
let active=null, selected="glas";
const $=id=>document.getElementById(id);
function el(t,a,txt){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);if(txt!=null)n.textContent=txt;return n}
function drawMap(){
  const S=STR[lang].axis;
  svg.innerHTML="";svg.setAttribute("aria-label",STR[lang].mapLabel);
  svg.appendChild(el("rect",{x:0,y:0,width:1000,height:1000,fill:"var(--surface)"}));
  [200,400].forEach(r=>svg.appendChild(el("circle",{cx:500,cy:500,r,class:"ring","stroke-dasharray":"2 6"})));
  svg.appendChild(el("line",{x1:40,y1:500,x2:960,y2:500,class:"axis"}));
  svg.appendChild(el("line",{x1:500,y1:64,x2:500,y2:936,class:"axis"}));
  svg.appendChild(el("text",{x:22,y:530,class:"axislbl"},S.l));
  svg.appendChild(el("text",{x:22,y:548,class:"axissub"},S.ls));
  svg.appendChild(el("text",{x:978,y:530,class:"axislbl","text-anchor":"end"},S.r));
  svg.appendChild(el("text",{x:978,y:548,class:"axissub","text-anchor":"end"},S.rs));
  svg.appendChild(el("text",{x:500,y:28,class:"axislbl","text-anchor":"middle"},S.t));
  svg.appendChild(el("text",{x:500,y:46,class:"axissub","text-anchor":"middle"},S.ts));
  svg.appendChild(el("text",{x:500,y:972,class:"axislbl","text-anchor":"middle"},S.b));
  svg.appendChild(el("text",{x:500,y:990,class:"axissub","text-anchor":"middle"},S.bs));
  svg.appendChild(el("circle",{cx:500,cy:500,r:88,fill:"var(--surface)"}));
  svg.appendChild(el("circle",{cx:500,cy:500,r:88,fill:"var(--accent)","fill-opacity":".12",stroke:"var(--accent)","stroke-width":"1.5"}));
  const cs="font-family:var(--display);font-size:18px;font-weight:700;fill:var(--accent)";
  svg.appendChild(el("text",{x:500,y:494,"text-anchor":"middle",style:cs},S.c1));
  svg.appendChild(el("text",{x:500,y:517,"text-anchor":"middle",style:cs},S.c2));
  E.forEach(e=>{
    const [cx,cy]=P(e.x,e.y);const left=cx>760;
    const g=el("g",{class:"node",tabindex:0,role:"button","data-id":e.id,"aria-label":T(e).label});
    g.appendChild(el("circle",{cx,cy,r:8,fill:`var(--c${e.k})`,stroke:"var(--surface)","stroke-width":2}));
    g.appendChild(el("text",{x:left?cx-14:cx+14,y:cy+5,"text-anchor":left?"end":"start"},T(e).label));
    g.addEventListener("click",()=>select(e.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select(e.id)}});
    svg.appendChild(g);
  });
  refresh();
}
function refresh(){
  svg.querySelectorAll(".node").forEach(g=>{const e=E.find(x=>x.id===g.dataset.id);g.classList.toggle("dim",!!active&&e.k!==active);g.classList.toggle("sel",e.id===selected)});
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.k===(active??"")?"true":"false"));
}
function vert(e){const v=STR[lang].vert;return e.y<-.35?v[0]:e.y>.35?v[1]:v[2]}
function linkList(e){const S=STR[lang];return `<ul class="links">${e.links.map(l=>`<li><span class="pill">${S.tags[l.tag]}</span><a href="${l[lang][1]}" target="_blank" rel="noopener">${l[lang][0]}</a></li>`).join("")}</ul>`}
function body(e,withQ){const t=T(e),c=C(e.k),D=STR[lang].dt,o=t.own||{};
  return `<p class="say">${t.say}</p><dl class="dl">
  <div><dt>${D.wahr}</dt><dd>${t.wahr}</dd></div>
  <div><dt>${D.kippt}</dt><dd>${t.kippt}</dd></div>
  <div><dt>${D.heute}</dt><dd>${t.heute}</dd></div>
  ${withQ?`<div><dt>${D.q}</dt><dd><i>${c.q}</i></dd></div>`:""}
  <div><dt>${D.bew}</dt><dd>${o.bew||c.bew}</dd></div>
  <div><dt>${D.vert}</dt><dd>${vert(e)}</dd></div>
  <div><dt>${D.links}</dt><dd>${linkList(e)}</dd></div></dl>`}
function select(id){
  selected=id;const e=E.find(x=>x.id===id);const c=C(e.k),S=STR[lang];
  $("panel").innerHTML=`<div class="cls" style="color:var(--c${e.k})">${S.kind} ${e.k} · ${c.name}</div><h3>${T(e).label}</h3>${body(e,true)}`;
  refresh();
}
function renderStatic(){
  const S=STR[lang];
  document.documentElement.lang=lang;document.title=S.title;
  $("s-eyebrow").textContent=S.eyebrow;$("s-h1").textContent=S.h1;
  $("s-intro1").textContent=S.intro1;$("s-intro2").textContent=S.intro2;
  $("h-mitte").textContent=S.hMitte;$("s-m1").textContent=S.m1;$("s-m2").textContent=S.m2;$("s-m3").textContent=S.m3;
  $("h-karte").textContent=S.hKarte;$("filters").setAttribute("aria-label",S.filterLabel);
  $("s-maphint").textContent=S.mapHint;
  $("h-klassen").textContent=S.hKlassen;$("s-kl1").textContent=S.kl1;
  $("h-katalog").textContent=S.hKatalog;$("h-offen").textContent=S.hOffen;
  $("s-t1").textContent=S.t1;$("s-t2").textContent=S.t2;$("s-t3").textContent=S.t3;
  $("s-foot1").textContent=S.foot1;$("s-foot2").innerHTML=S.foot2;
}
function renderLists(){
  const S=STR[lang],D=S.dt;
  const f=$("filters");f.innerHTML="";
  const all=document.createElement("button");all.className="chip";all.dataset.k="";all.textContent=S.all;all.onclick=()=>{active=null;refresh()};f.appendChild(all);
  Object.keys(CLASSES).forEach(k=>{const b=document.createElement("button");b.className="chip";b.dataset.k=k;b.innerHTML=`<i style="background:var(--c${k})"></i>${C(k).name}`;b.onclick=()=>{active=active===k?null:k;refresh()};f.appendChild(b)});
  const cl=$("classes");cl.innerHTML="";
  Object.keys(CLASSES).forEach(k=>{const c=C(k);const d=document.createElement("div");d.className="klass";d.style.setProperty("--c",`var(--c${k})`);
    d.innerHTML=`<div class="tag">${k} · ${c.sub}</div><h3>${c.name}</h3><p>${c.mech}</p><dl class="dl"><div><dt>${D.q}</dt><dd><i>${c.q}</i></dd></div><div><dt>${D.erk}</dt><dd>${c.erk}</dd></div><div><dt>${D.bew}</dt><dd>${c.bew}</dd></div></dl><p class="meta">${E.filter(e=>e.k===k).length} ${S.entries}: ${E.filter(e=>e.k===k).map(e=>T(e).label).join(", ")}</p>`;cl.appendChild(d)});
  const cat=$("catalog");cat.innerHTML="";
  Object.keys(CLASSES).forEach(k=>{
    const g=document.createElement("div");g.className="group";
    g.innerHTML=`<h3><i style="background:var(--c${k})"></i>${C(k).name}</h3><p class="gq">${C(k).q}</p><div class="items">${E.filter(e=>e.k===k).map(e=>`<article class="item"><h4>${T(e).label}</h4>${body(e,false)}<button type="button" data-id="${e.id}">${S.show}</button></article>`).join("")}</div>`;
    cat.appendChild(g);
  });
}
function render(){
  renderStatic();renderLists();drawMap();select(selected);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
}
function setLang(l){if(l===lang)return;lang=l;try{localStorage.setItem("lang",l)}catch(_){}render()}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
$("catalog").addEventListener("click",ev=>{const b=ev.target.closest("button[data-id]");if(!b)return;active=null;select(b.dataset.id);$("h-karte").scrollIntoView({behavior:"smooth"})});
try{const s=localStorage.getItem("lang");if(s==="en"||s==="de")lang=s}catch(_){}
render();
</script>

</body></html>
